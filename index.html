<style>
:root{
  --navy:#14284b;--navy2:#1f3a68;--ink:#1a1f2b;--muted:#667085;--line:#e3e7ee;--bg:#f4f6f9;--card:#fff;
  --ok:#157f4a;--okbg:#e5f5ec;--warn:#a15c00;--warnbg:#fff1d6;--bad:#b42318;--badbg:#fde8e6;
  --info:#1d4ed8;--infobg:#e3ebfd;--gray:#475467;--graybg:#eef0f4;--purple:#6d28d9;--purplebg:#efe7fd;
  --radius:14px;--safe-b:env(safe-area-inset-bottom,0px);
}
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
.hrow{display:flex;align-items:center;gap:10px;max-width:960px;margin:0 auto}
.htitle{flex:1;min-width:0}
.htitle b{display:block;font-size:17px}
.htitle small{opacity:.75;font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{font-size:11px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.15);white-space:nowrap}
.sync.off{background:#b42318}
main{max-width:960px;margin:0 auto;padding:12px 16px calc(84px + var(--safe-b))}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:var(--safe-b)}
nav.tabs button{flex:1;border:0;background:none;padding:9px 4px 8px;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.tabs button.on{color:var(--navy2);font-weight:600}
nav.tabs svg{width:22px;height:22px}
.search{display:flex;gap:8px;margin-bottom:10px}
.search input{flex:1;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;white-space:nowrap;font-size:13px;cursor:pointer}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.sec{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin:14px 2px 6px;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:8px}
.pt{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.gb{flex:0 0 auto;min-width:40px;height:40px;border-radius:10px;background:var(--navy);color:#fff;font-weight:700;display:grid;place-items:center;font-size:14px}
.pt .info{flex:1;min-width:0}
.pt .name{font-weight:600;line-height:1.25}
.pt .meta{color:var(--muted);font-size:13px;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.t-ok{background:var(--okbg);color:var(--ok)}.t-warn{background:var(--warnbg);color:var(--warn)}.t-bad{background:var(--badbg);color:var(--bad)}
.t-info{background:var(--infobg);color:var(--info)}.t-gray{background:var(--graybg);color:var(--gray)}.t-purple{background:var(--purplebg);color:var(--purple)}
.calls{display:flex;gap:6px;margin-top:10px}
.callbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:10px;background:var(--okbg);color:var(--ok);font-weight:600;text-decoration:none;font-size:14px}
.callbtn svg{width:16px;height:16px;flex:0 0 auto}
.callbtn span{line-height:1.15;text-align:left}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--graybg);color:var(--ink)}
.btn.pri{background:var(--navy);color:#fff}.btn.danger{background:var(--badbg);color:var(--bad)}
.btn.block{width:100%}
.fab{position:fixed;right:18px;bottom:calc(78px + var(--safe-b));z-index:21;width:54px;height:54px;border-radius:50%;border:0;background:var(--navy);color:#fff;font-size:28px;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer}
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:86vh;max-height:calc(100dvh - 20px);overflow:auto;overscroll-behavior:contain;border-radius:18px 18px 0 0;padding:0 0 calc(16px + var(--safe-b))}
@media (min-width:760px){.sheet-bg{align-items:center}.sheet{border-radius:18px;max-height:90vh}}
.sh-head{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px;z-index:2}
.sh-head b{flex:1;font-size:16px}
.x{border:0;background:var(--graybg);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px}
.sh-body{padding:14px 16px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.kv div small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.03em}
.studies{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.st{border-radius:10px;padding:8px 10px;font-size:13px}
.st b{display:block;font-size:12px}
.st span{font-size:12px;display:block;white-space:normal}
.st{white-space:normal}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:10px}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:15px}
.na{display:flex;align-items:center;gap:4px;font-size:12px;margin-top:4px}
.na input{width:auto;margin:0}
.login{max-width:380px;margin:12vh auto;text-align:center;padding:0 20px}
.login .logo{width:76px;height:76px;margin:0 auto 14px}
.notice{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{font-size:24px;display:block}
.stat small{color:var(--muted)}
table.res{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border-radius:12px;overflow:hidden}
table.res th,table.res td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center}
table.res th:first-child,table.res td:first-child{text-align:left;padding-left:12px}
.hist{font-size:13px;border-left:3px solid var(--line);padding:4px 0 8px 10px;margin-bottom:6px}
.hist small{color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + var(--safe-b));background:#111827;color:#fff;padding:10px 16px;border-radius:12px;z-index:60;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
textarea{resize:vertical}
input:not([type]),input[type=text],input[type=search],input[type=tel],textarea{text-transform:uppercase}
input[type=search]::placeholder,textarea::placeholder,input::placeholder{text-transform:none}
.chip-h{border-style:dashed;color:var(--gray)}
.c-baja-h td{background:#f4f5f7}
/* ---- Vista de computadora ---- */
body.pc main{max-width:none;padding:10px 18px 30px}
body.pc .hrow{max-width:none}
body.pc header{padding:8px 18px}
.htabs{display:flex;gap:4px;margin-left:12px}
.htabs button{border:0;background:rgba(255,255,255,.1);color:#fff;padding:7px 14px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:14px}
.htabs button svg{width:17px;height:17px}
.htabs button.on{background:#fff;color:var(--navy);font-weight:700}
body.pc .fab{bottom:24px}
.pc-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.pc-bar .vb{font-size:13px;color:var(--muted);white-space:nowrap}
.ley{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-left:auto}
.ley span{display:flex;align-items:center;gap:4px}.ley i{width:14px;height:14px;border:1px solid #b9c0cc;border-radius:3px;display:inline-block;background:#fff}
.tbl-wrap{overflow:auto;max-height:calc(100vh - 210px);border:1px solid #c9ced8;border-radius:8px;background:#fff}
table.xl{border-collapse:collapse;width:100%;min-width:1500px;table-layout:fixed;font-size:12.5px;line-height:1.3}
table.xl th{position:sticky;top:0;z-index:1;background:var(--navy);color:#fff;font-weight:600;font-size:11px;padding:7px 5px;text-align:left;border-right:1px solid #2c4a7c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.xl td{border:1px solid #d5dae2;padding:4px 6px;vertical-align:top}
table.xl tbody tr{cursor:pointer}
table.xl tbody tr:hover td{outline:1px solid #7a8aa6;filter:brightness(.96)}
table.xl td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
table.xl td.nw{white-space:nowrap;text-overflow:ellipsis}
table.xl td{overflow:hidden;overflow-wrap:anywhere}
table.xl td.nom{font-weight:600}
table.xl td .cl{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
table.xl td.tel .cl,table.xl td.obs .cl{font-size:11.5px}
table.xl tbody tr:hover .cl{-webkit-line-clamp:12}
.c-pro td,.ley i.c-pro{background:#fff59d}
.c-ok td,.ley i.c-ok{background:#a8e0a0}
.c-ver td,.ley i.c-ver{background:#ffc4f1}
.c-ci td,.ley i.c-ci{background:#d9d9d9}
.c-nl td,.ley i.c-nl{background:#9eebf3}
.c-baja td{background:#f2f3f5;color:#8a93a3;text-decoration:line-through}.ley i.c-baja{background:#f2f3f5}
td.d-bad{color:#b42318;font-weight:700}td.d-warn{color:#a15c00;font-weight:700}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:8px}
.cgrid .card{margin:0}
</style>
</head>

<script type="module">
// ===================== CONFIGURACIÓN =====================
// Pega aquí la configuración de TU proyecto de Firebase (ver GUIA.md).
// Estos valores no son secretos: la seguridad la dan las reglas de Firestore.
const firebaseConfig = {
  apiKey: "AIzaSyCcwi3hKOXWeL_0xNfc8f2VhGxW4iuCLAo",
  authDomain: "lista-espera-tr.firebaseapp.com",

// =========================================================

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// ---------- Catálogos ----------
const GRUPOS = ["A+","A-","B+","B-","O+","O-","AB+","AB-"];
const ESTATUS = ["ACTIVO","DIFERIDO TEMPORAL","EN PROTOCOLO","BAJA DEFINITIVA","TRASPLANTADO"];
const ESTATUS_INFO = {
  "ACTIVO":"Protocolo completo y aceptado. Puede recibir oferta de órgano hoy.",
  "DIFERIDO TEMPORAL":"Sigue en lista pero por ahora NO recibe ofertas. Causa reversible: requiere motivo y fecha de revaloración.",
  "EN PROTOCOLO":"Aún no completa su evaluación inicial; no está en lista activa.",
  "BAJA DEFINITIVA":"Sale de la lista por causa no reversible (contraindicación, defunción, cambio de unidad, decisión del paciente).",
  "TRASPLANTADO":"Ya recibió trasplante; se conserva para registro."
};
const MOTIVOS_DIF = ["Actualización de protocolo","No localizado","Infección activa","Evento cardiovascular","Cirugía o trauma","Causa social / económica","Otro"];
const MOTIVOS_BAJA = ["Contraindicación","Defunción","Cambio de unidad","Decisión del paciente","Trasplante de donador vivo","Otro"];
// Estatus anteriores → nuevos (migración automática)
const MIGRA = { "COMPLETO":["ACTIVO",""], "INCOMPLETO":["EN PROTOCOLO",""], "CADUCADO":["DIFERIDO TEMPORAL","Actualización de protocolo"],
  "EN ACTUALIZACIÓN":["DIFERIDO TEMPORAL","Actualización de protocolo"], "NO LOCALIZADO":["DIFERIDO TEMPORAL","No localizado"],
  "INACTIVO TEMPORAL":["DIFERIDO TEMPORAL","Otro"], "INACTIVO DEFINITIVO":["BAJA DEFINITIVA","Otro"] };
const migrar = p => { const m = MIGRA[p.estatus]; return m ? { ...p, estatus: m[0], motivo: p.motivo || m[1] } : p; };
const TERAPIAS = ["HD","DP","PREDIÁLISIS"];
// Estudios: [clave, etiqueta, meses de vigencia (0 = no caduca), requerido]
const ESTUDIOS = [
  ["cardio","Cardiología",6,true],["ecott","ECOTT",6,true],["serologias","Serologías",6,true],["ppd","PPD",6,true],["otorrino","Otorrino",6,true],
  ["urologia","Urología",0,true],["infecto","Infectología",0,true],["psicologia","Psicología",0,true],["psiquiatria","Psiquiatría",0,true],
  ["qxtr","Qx Trasplante",0,true],["neumologia","Neumología",0,true],["dental","Dental",0,true],["gineco","Ginecología",0,true],
  ["valorado","Valorado (comité)",0,false]
];
const CAMPOS_LABEL = {grupo:"Grupo",nombre:"Nombre",fnac:"Fecha nacimiento",nss:"NSS",agregado:"Agregado",tel1:"Tel 1",tel2:"Tel 2",noTx:"No. trasplante",
  etiologia:"Etiología",terapia:"Terapia",estatus:"Estatus",motivo:"Motivo",fechaEstatus:"Fecha estatus",revalorar:"Revalorar el",ultimoContacto:"Último contacto",observaciones:"Observaciones"};
ESTUDIOS.forEach(([k,l]) => CAMPOS_LABEL["estudios."+k] = l);

// ---------- Fechas ----------
const hoy = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const parse = s => { if (!s || s === "NA") return null; const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addMonths = (d, n) => { const r = new Date(d); r.setMonth(r.getMonth() + n); return r; };
const fmt = s => { if (!s) return "—"; if (s === "NA") return "NA"; const [y,m,d] = s.split("-"); return `${d}/${m}/${y}`; };
const fmtD = d => d ? `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}` : "—";
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const edad = s => { const d = parse(s); if (!d) return ""; const h = hoy(); let a = h.getFullYear() - d.getFullYear();
  if (h.getMonth() < d.getMonth() || (h.getMonth() === d.getMonth() && h.getDate() < d.getDate())) a--; return a; };

// ---------- Cálculo del protocolo ----------
function evalEstudio(key, val, meses) {
  if (val === "NA") return {s:"na", txt:"No aplica"};
  const d = parse(val);
  if (!d) return {s:"falta", txt:"Pendiente"};
  if (!meses) return {s:"ok", txt:fmt(val)};
  const vence = addMonths(d, meses), h = hoy();
  if (vence < h) return {s:"cad", txt:`${fmt(val)}<br>venció ${fmtD(vence)}`, vence};
  if ((vence - h) / 864e5 <= 30) return {s:"pronto", txt:`${fmt(val)}<br>vence ${fmtD(vence)}`, vence};
  return {s:"ok", txt:`${fmt(val)}<br>vence ${fmtD(vence)}`, vence};
}
function protocolo(p) {
  let cad = 0, falt = 0, prox = null, pronto = 0;
  for (const [k,,m,req] of ESTUDIOS) {
    const e = evalEstudio(k, p.estudios?.[k] || "", m);
    if (req && e.s === "falta") falt++;
    if (e.s === "cad") cad++;
    if (e.s === "pronto") pronto++;
    if (e.vence && (!prox || e.vence < prox)) prox = e.vence;
  }
  let alerta;
  if (p.estatus === "TRASPLANTADO" || p.estatus === "BAJA DEFINITIVA") alerta = "—";
  else if (p.estatus === "DIFERIDO TEMPORAL" && p.revalorar && parse(p.revalorar) <= hoy()) alerta = "REVALORAR";
  else if (cad) alerta = "CADUCADO";
  else if (falt) alerta = "INCOMPLETO";
  else if (pronto) alerta = "POR VENCER";
  else alerta = "VIGENTE";
  return {cad, falt, prox, alerta};
}
const tagEstatus = e => ({"ACTIVO":"t-ok","DIFERIDO TEMPORAL":"t-warn","EN PROTOCOLO":"t-info","BAJA DEFINITIVA":"t-gray","TRASPLANTADO":"t-purple"}[e] || "t-gray");
const tagAlerta = a => ({"VIGENTE":"t-ok","POR VENCER":"t-warn","INCOMPLETO":"t-warn","CADUCADO":"t-bad","REVALORAR":"t-purple"}[a] || "t-gray");
const ORD_G = g => { const i = ["A+","B+","O+","AB+","A-","B-","O-","AB-"].indexOf(g); return i < 0 ? 99 : i; };

// ---------- Íconos ----------
const I = {

  star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',

  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>'
};

// ---------- Estado ----------
const S = { user:null, rol:null, pacientes:[], acceso:{editores:[],lectores:[]}, tab:"elegibles", q:"", fGrupo:"", fEstatus:"", fAlerta:"",
  online:navigator.onLine, pendientes:false, unsub:[] };
const puedeEditar = () => S.rol === "admin" || S.rol === "editor";

function toast(msg){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2600); }

// ---------- Firebase ----------
const configurado = !Object.values(firebaseConfig).some(v => String(v).includes("PEGAR_AQUI"));
let auth, db;
if (configurado) {
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
  getRedirectResult(auth).catch(e => console.warn(e));
  onAuthStateChanged(auth, onUser);
} else {
  $app.innerHTML = `<div class="login"><img class="logo" src="icon.svg" alt=""><h2>Falta configurar</h2>
    <p style="color:var(--muted)">Pega la configuración de tu proyecto de Firebase en <b>index.html</b> (sección CONFIGURACIÓN). Ver README.md.</p></div>`;
}

function renderLogin(msg = "") {
  $app.innerHTML = `<div class="login">
    <img class="logo" src="icon.svg" alt="">
    <h2 style="margin:0 0 4px">Lista de Espera</h2>
    <p style="color:var(--muted);margin:0 0 22px">Trasplante renal · donador fallecido<br>UMAE HE No. 1 · CMN del Bajío</p>
    ${msg ? `<div class="notice">${msg}</div>` : ""}
    <button class="btn pri block" id="bLogin">Entrar con Google</button>
    <p style="color:var(--muted);font-size:12px;margin-top:18px">Acceso solo para personal autorizado.</p></div>`;
  document.getElementById("bLogin").onclick = async () => {
    const prov = new GoogleAuthProvider(); prov.setCustomParameters({prompt:"select_account"});
    try { await signInWithPopup(auth, prov); }
    catch (e) { if (e.code === "auth/popup-blocked") await signInWithRedirect(auth, prov); else renderLogin("No se pudo iniciar sesión: " + esc(e.code || e.message)); }
  };
}

async function onUser(u) {
  S.unsub.forEach(f => f()); S.unsub = [];
  S.user = u;
  if (!u) { renderLogin(); return; }
  const email = (u.email || "").toLowerCase();
  if (email === ADMIN_EMAIL) S.rol = "admin";
  else {
    try {
      const snap = await getDoc(doc(db, "config", "acceso"));
      const a = snap.data() || {};
      S.rol = (a.editores || []).includes(email) ? "editor" : (a.lectores || []).includes(email) ? "lector" : null;
    } catch { S.rol = null; }
  }
  if (!S.rol) { await signOut(auth); renderLogin(`La cuenta <b>${esc(email)}</b> no tiene acceso. Pide al Dr. Tapia que la agregue.`); return; }
  $app.innerHTML = `<div class="empty">Cargando…</div>`;
  let first = true;
  const t = setTimeout(() => { if (first) $app.innerHTML = `<div class="empty">Sin conexión y sin datos guardados en este dispositivo. Conéctate una vez para descargar la lista.</div>`; }, 12000);
  S.unsub.push(onSnapshot(collection(db, "pacientes"), { includeMetadataChanges: true }, snap => {
    first = false; clearTimeout(t);
    S.pacientes = snap.docs.map(d => migrar({ id: d.id, ...d.data() }));
    if (S.rol === "admin" && !snap.metadata.fromCache && !S.migrado) {
      S.migrado = true;
      const viejos = snap.docs.filter(d => MIGRA[d.data().estatus]);
      if (viejos.length) {
        const b = writeBatch(db);
        viejos.forEach(d => { const a = d.data(), n = migrar(a);
          b.update(d.ref, { estatus: n.estatus, motivo: n.motivo });
          b.set(doc(collection(db, "historial")), { pacienteId: d.id, nombre: a.nombre, accion: "Estatus actualizado a nueva terminología",
            cambios: { estatus: [a.estatus, n.estatus], ...(n.motivo ? { motivo: ["", n.motivo] } : {}) }, por: S.user.email, fecha: serverTimestamp() }); });
        b.commit().catch(() => {});
      }
    }
    S.pendientes = snap.metadata.hasPendingWrites;
    S.desdeCache = snap.metadata.fromCache;
    render();
  }, e => { $app.innerHTML = `<div class="empty">Error de acceso: ${esc(e.code)}</div>`; }));
  if (S.rol === "admin") S.unsub.push(onSnapshot(doc(db, "config", "acceso"), s => { S.acceso = { editores:[], lectores:[], ...(s.data()||{}) }; if (S.tab === "mas" && S.mas === "ajustes") render(); }));
  subscribeListas(); subscribeHist();
}
addEventListener("online", () => { S.online = true; render(); });
addEventListener("offline", () => { S.online = false; render(); });
addEventListener("popstate", () => {
  if (S.popWait) { const r = S.popWait; S.popWait = null; r(); return; }
  const abiertas = document.querySelectorAll(".sheet-bg"); const top = abiertas[abiertas.length - 1];
  if (top && top.__close) top.__close();
});

// ---------- Render principal ----------
function render() {
  if (!S.user || !S.rol) return;
  const scroll = scrollY;
  const syncTxt = !S.online ? "Sin conexión · guardado en el equipo" : S.pendientes ? "Sincronizando…" : "Sincronizado";
  const tabs = [["elegibles","Elegibles",I.star],["lista","Listos",I.list],["protocolo","Protocolo",I.prot],["espera","Espera",I.fila],["mas","Más",I.mas]];
  const pc = PC(); document.body.classList.toggle("pc", pc);
  const tabBtns = tabs.map(([k,l,ic]) => `<button data-tab="${k}" class="${S.tab===k?"on":""}">${ic}${l}</button>`).join("");
  $app.innerHTML = `
  <header><div class="hrow"><div class="htitle" ${pc ? 'style="flex:0 0 auto"' : ""}><b>Lista de Espera TR</b><small>${esc(S.user.email)} · ${S.rol === "lector" ? "solo consulta" : S.rol}</small></div>
    ${pc ? `<div class="htabs">${tabBtns}</div><div style="flex:1"></div>` : ""}
    <span class="sync ${!S.online ? "off" : ""}">${syncTxt}</span></div></header>
  <main id="main"></main>
  ${puedeEditar() && ["lista","elegibles"].concat(pc ? [] : ["espera"]).includes(S.tab) ? `<button class="fab" id="fab" aria-label="Nuevo">+</button>` : ""}
  ${pc ? "" : `<nav class="tabs">${tabBtns}</nav>`}`;
  document.querySelectorAll("nav.tabs button, .htabs button").forEach(b => b.onclick = () => { S.tab = b.dataset.tab; render(); scrollTo(0,0); });
  const fab = document.getElementById("fab"); if (fab) fab.onclick = () => S.tab === "espera" ? regForm(S.q2 ? S.lst : S.lst, null) : openForm(null);
  const m = document.getElementById("main");
  ({ elegibles: vElegibles, lista: vLista, protocolo: vProtocolo, espera: vEspera, mas: vMas })[S.tab](m);
  scrollTo(0, scroll);
}

function telLinks(p) {
  const t = [p.tel1, p.tel2].filter(Boolean);
  if (!t.length) return `<div class="meta" style="margin-top:8px">Sin teléfono registrado</div>`;
  return `<div class="calls">${t.map((n,i) => `<a class="callbtn" href="tel:${esc(n.replace(/\D/g,""))}" onclick="event.stopPropagation()">${I.phone}${esc(n)}</a>`).join("")}</div>`;
}
function ptCard(p, conTel = false) {
  const pr = protocolo(p);
  return `<div class="card" data-id="${esc(p.id)}"><div class="pt">
    <div class="gb">${esc(p.grupo)}</div>
    <div class="info"><div class="name">${esc(p.nombre)}</div>
      <div class="meta">${[p.regL && lugar(p.regL, p.regK) ? "Lugar " + lugar(p.regL, p.regK) : "", edad(p.fnac) !== "" ? edad(p.fnac) + " años" : "", p.terapia, p.noTx ? "Tx #" + p.noTx : "", p.idCenatra ? "ID " + p.idCenatra : ""].filter(Boolean).map(esc).join(" · ")}</div>
      <div class="tags"><span class="tag ${tagEstatus(p.estatus)}">${esc(p.estatus || "SIN ESTATUS")}${p.motivo && /DIFERIDO|BAJA/.test(p.estatus) ? " · " + esc(p.motivo) : ""}</span>

function bindCards(root) { root.querySelectorAll(".card[data-id]").forEach(c => c.onclick = () => openFicha(c.dataset.id)); }
const ordenar = arr => arr.sort((a,b) => ORD_G(a.grupo) - ORD_G(b.grupo) || a.nombre.localeCompare(b.nombre, "es"));

function vElegibles(m) {
  const el = ordenar(S.pacientes.filter(p => p.estatus === "ACTIVO"));
  const porG = {}; el.forEach(p => (porG[p.grupo] ||= []).push(p));
  const conCad = el.filter(p => protocolo(p).alerta === "CADUCADO").length;
  m.innerHTML = `<div class="notice" style="background:var(--infobg);color:var(--info)">Pacientes <b>ACTIVOS</b> (pueden recibir oferta). Toca un teléfono para llamar.</div>
    ${conCad ? `<div class="notice" style="background:var(--badbg);color:var(--bad)"><b>${conCad} de ${el.length}</b> tienen estudios caducados según sus fechas. Actualízalos o pásalos a DIFERIDO TEMPORAL.</div>` : ""}
    ${!el.length ? `<div class="empty">No hay pacientes ACTIVOS.</div>` :
      Object.keys(porG).sort((a,b) => ORD_G(a)-ORD_G(b)).map(g => `<div class="sec">Grupo ${esc(g)} · ${porG[g].length}</div><div class="${PC() ? "cgrid" : ""}">${porG[g].map(p => ptCard(p, true)).join("")}</div>`).join("")}`;
  bindCards(m);
}

function vLista(m) {
  const q = S.q.toLowerCase().normalize("NFD").replace(/\p{Diacritic}/gu,"");
  const norm = s => (s||"").toLowerCase().normalize("NFD").replace(/\p{Diacritic}/gu,"");
  let arr = S.pacientes.filter(p => (!S.fGrupo || p.grupo === S.fGrupo) && (!S.fEstatus || p.estatus === S.fEstatus)
    && (!S.fAlerta || protocolo(p).alerta === S.fAlerta)
    && (!q || norm(p.nombre).includes(q) || (p.nss||"").includes(q) || (p.tel1||"").includes(q) || (p.tel2||"").includes(q)));
  ordenar(arr);
  const gruposUsados = GRUPOS.filter(g => S.pacientes.some(p => p.grupo === g));
  m.innerHTML = `<div class="search"><input id="q" type="search" placeholder="Buscar nombre, NSS o teléfono" value="${esc(S.q)}"></div>
    <div class="chips">${["", ...gruposUsados].map(g => `<button class="chip ${S.fGrupo===g?"on":""}" data-g="${g}">${g || "Todos"}</button>`).join("")}</div>
    <div class="chips">${["", ...ESTATUS].map(e => `<button class="chip ${S.fEstatus===e?"on":""}" data-e="${e}">${e || "Cualquier estatus"}</button>`).join("")}</div>
    <div class="chips">${["","CADUCADO","POR VENCER","INCOMPLETO","VIGENTE","REVALORAR"].map(a => `<button class="chip ${S.fAlerta===a?"on":""}" data-a="${a}">${a ? "Protocolo: "+a : "Cualquier alerta"}</button>`).join("")}</div>
    <div class="pc-bar"><div class="sec" style="margin:4px 2px">${arr.length} paciente${arr.length===1?"":"s"}</div>${PC() ? leyenda(["c-ok","c-pro","c-ci","c-nl","c-baja"]).replace("Protocolo completo / Listos","Activo") .replace("Contraindicado temporal","Diferido temporal") : ""}</div>
    ${!arr.length ? `<div class="empty">Sin resultados.</div>` : PC() ? tablaPacientes(arr) : arr.map(p => ptCard(p)).join("")}`;
  const qi = m.querySelector("#q");
  qi.oninput = () => { S.q = qi.value; const pos = qi.selectionStart; render(); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(pos,pos); };
  m.querySelectorAll("[data-g]").forEach(b => b.onclick = () => { S.fGrupo = b.dataset.g; render(); });
  m.querySelectorAll("[data-e]").forEach(b => b.onclick = () => { S.fEstatus = b.dataset.e; render(); });
  m.querySelectorAll("[data-a]").forEach(b => b.onclick = () => { S.fAlerta = b.dataset.a; render(); });
  bindCards(m); bindTabla(m);
}

function vResumen(m) {
  const gs = GRUPOS.filter(g => S.pacientes.some(p => p.grupo === g));
  const cnt = (g, f) => S.pacientes.filter(p => (!g || p.grupo === g) && f(p)).length;
  const activos = S.pacientes.filter(p => !["TRASPLANTADO","BAJA DEFINITIVA"].includes(p.estatus));
  const prox30 = activos.filter(p => { const pr = protocolo(p); return pr.prox && pr.prox >= hoy() && (pr.prox - hoy())/864e5 <= 30; });
  const cols = ["ACTIVO","DIFERIDO TEMPORAL","EN PROTOCOLO","BAJA DEFINITIVA","TRASPLANTADO"];
  const abrev = {"ACTIVO":"ACTIVO","DIFERIDO TEMPORAL":"DIFERIDO","EN PROTOCOLO":"PROTOC.","BAJA DEFINITIVA":"BAJA","TRASPLANTADO":"TX"};
  m.innerHTML = `<div class="stats">
      <div class="stat"><b style="color:var(--ok)">${cnt("", p => p.estatus === "ACTIVO")}</b><small>Activos (reciben oferta)</small></div>
      <div class="stat"><b style="color:var(--warn)">${cnt("", p => p.estatus === "DIFERIDO TEMPORAL")}</b><small>Diferidos temporales</small></div>
      <div class="stat"><b style="color:var(--bad)">${activos.filter(p => protocolo(p).alerta === "CADUCADO").length}</b><small>Con estudios caducados (sin bajas ni Tx)</small></div>
      <div class="stat"><b style="color:var(--warn)">${prox30.length}</b><small>Vencen en 30 días</small></div></div>
    <div class="sec">Por grupo y estatus</div>
    <div style="overflow-x:auto"><table class="res"><tr><th>Grupo</th><th>Total</th>${cols.map(c => `<th>${abrev[c]}</th>`).join("")}</tr>
      ${gs.map(g => `<tr><td><b>${g}</b></td><td>${cnt(g,()=>true)}</td>${cols.map(c => `<td>${cnt(g, p => p.estatus === c) || ""}</td>`).join("")}</tr>`).join("")}
      <tr><td><b>Total</b></td><td><b>${S.pacientes.length}</b></td>${cols.map(c => `<td><b>${cnt("", p => p.estatus === c) || ""}</b></td>`).join("")}</tr></table></div>
    ${prox30.length ? `<div class="sec">Estudios que vencen en los próximos 30 días</div>${ordenar(prox30).map(p => ptCard(p)).join("")}` : ""}
    <div class="sec">Leyenda de estatus</div>
    <div class="card">${ESTATUS.map(e => `<div style="margin-bottom:8px"><span class="tag ${tagEstatus(e)}">${e}</span> <span style="font-size:13px;color:var(--muted)">${ESTATUS_INFO[e]}</span></div>`).join("")}
      <div style="font-size:13px;color:var(--muted);margin-top:8px"><b>Estatus</b> = decisión del equipo (¿puede recibir oferta hoy?). <b>Protocolo</b> = cálculo automático por fechas (¿sus estudios siguen vigentes?): Cardiología, ECOTT, Serologías, PPD y Otorrino caducan a los 6 meses. Un ACTIVO con protocolo CADUCADO se marca en rojo para actualizarlo o diferirlo.</div></div>`;
  bindCards(m);
}

}

// ---------- Ficha ----------
function sheet(titulo, body, acciones = "") {
  const bg = document.createElement("div"); bg.className = "sheet-bg";
  bg.innerHTML = `<div class="sheet"><div class="sh-head"><b>${titulo}</b>${acciones}<button class="x" aria-label="Cerrar">×</button></div><div class="sh-body">${body}</div></div>`;
  // Cada ventana agrega una entrada al historial: deslizar "atrás" (iPhone) o el botón atrás (Android) la cierra.
  const sid = Date.now() + Math.random();
  history.pushState({ sheet: sid }, "");
  const close = () => new Promise(res => {
    if (!bg.isConnected) return res();
    bg.remove(); if (!document.querySelector(".sheet-bg")) document.body.style.overflow = "";
    try { bg.__onClose && bg.__onClose(); } catch {}
    if (history.state && history.state.sheet === sid) { S.popWait = res; history.back(); } else res();
  });
  bg.__close = close;
  bg.querySelector(".x").onclick = () => close(); bg.onclick = e => { if (e.target === bg) close(); };
  document.body.appendChild(bg); document.body.style.overflow = "hidden";
  return { el: bg, close };
}
function openFicha(id) {
  const p = S.pacientes.find(x => x.id === id); if (!p) return;
  const pr = protocolo(p);
  const est = ESTUDIOS.map(([k,l,mes]) => { const e = evalEstudio(k, p.estudios?.[k] || "", mes);
    const cls = {ok:"t-ok",pronto:"t-warn",cad:"t-bad",falta:"t-gray",na:"t-gray"}[e.s];
    return `<div class="st tag ${cls}" style="border-radius:10px"><b>${l}${mes ? ` <span style="font-weight:400">(${mes} m)</span>` : ""}</b><span>${e.txt}</span></div>`; }).join("");
  const lg = p.regL && p.regK ? lugar(p.regL, p.regK) : null;
  const kv = [...(lg ? [["Lugar en lista", `${lg} · ${LST[p.regL].n}`]] : []), ...(p.idCenatra ? [["ID CENATRA", p.idCenatra]] : []), ["Edad", edad(p.fnac) !== "" ? edad(p.fnac) + " años" : "—"],["Nacimiento", fmt(p.fnac)],["NSS", p.nss],["Agregado", p.agregado],
    ["Terapia", p.terapia],["No. trasplante", p.noTx],["Etiología", p.etiologia],["Fecha estatus", fmt(p.fechaEstatus)],
    ...(/DIFERIDO|BAJA/.test(p.estatus) ? [["Motivo", p.motivo]] : []),...(p.estatus === "DIFERIDO TEMPORAL" ? [["Revalorar el", fmt(p.revalorar)]] : []),["Último contacto", fmt(p.ultimoContacto)]]
    .map(([k,v]) => `<div><small>${k}</small>${esc(v || "—")}</div>`).join("");
  const sh = sheet(esc(p.nombre), `
    <div class="tags" style="margin:0 0 10px"><span class="tag t-info">Grupo ${esc(p.grupo)}</span><span class="tag ${tagEstatus(p.estatus)}">${esc(p.estatus)}</span>
      ${pr.alerta !== "—" ? `<span class="tag ${tagAlerta(pr.alerta)}">Protocolo: ${pr.alerta}</span>` : ""}</div>
    ${telLinks(p)}
    ${p.observaciones ? `<div class="card" style="margin-top:12px"><small style="color:var(--muted)">OBSERVACIONES</small><div>${esc(p.observaciones)}</div></div>` : ""}
    <div class="card" style="margin-top:12px"><div class="kv">${kv}</div></div>

  }, () => {});

// ---------- Guardado con historial ----------
function flat(p) {
  const o = {}; for (const k of Object.keys(CAMPOS_LABEL)) { if (k.startsWith("estudios.")) o[k] = p.estudios?.[k.slice(9)] || ""; else o[k] = p[k] ?? ""; } return o;
}
async function guardar(id, nuevo, accion) {
  for (const c of ["nombre","observaciones","agregado","etiologia","nss"]) if (typeof nuevo[c] === "string") nuevo[c] = nuevo[c].toUpperCase();
  const antes = id ? S.pacientes.find(x => x.id === id) : null;
  const a = antes ? flat(antes) : {}, b = flat(nuevo), cambios = {};
  for (const k of Object.keys(b)) if ((a[k] || "") !== (b[k] || "")) cambios[k] = [a[k] || "", b[k] || ""];
  if (antes && !Object.keys(cambios).length) { toast("Sin cambios"); return true; }
  const ref = id ? doc(db, "pacientes", id) : doc(collection(db, "pacientes"));
  const data = { ...nuevo, actualizado: serverTimestamp(), actualizadoPor: S.user.email };
  delete data.id;
  const batch = writeBatch(db);
  batch.set(ref, data);
  batch.set(doc(collection(db, "historial")), { pacienteId: ref.id, nombre: nuevo.nombre, accion, cambios, por: S.user.email, fecha: serverTimestamp() });
  if (nuevo.regL && nuevo.regK && S.reg[nuevo.regL]?.[nuevo.regK] && (antes?.estatus !== nuevo.estatus) && ["TRASPLANTADO","BAJA DEFINITIVA"].includes(nuevo.estatus)) {
    const bm = nuevo.estatus === "TRASPLANTADO" ? "Trasplante" : (nuevo.motivo === "Defunción" ? "Defunción" : (nuevo.motivo || "Otro"));
    batch.update(doc(db, "listas", nuevo.regL), { [`items.${nuevo.regK}.f`]: "B", [`items.${nuevo.regK}.bm`]: bm, [`items.${nuevo.regK}.bf`]: iso(new Date()) });
    batch.set(doc(collection(db, "historial")), { pacienteId: `${nuevo.regL}:${nuevo.regK}`, nombre: nuevo.nombre, accion: "Baja de la lista", cambios: { "Motivo de baja": ["", bm] }, por: S.user.email, fecha: serverTimestamp() });
  } else if (nuevo.regL && nuevo.regK && S.reg[nuevo.regL]?.[nuevo.regK]?.f === "B" && !["TRASPLANTADO","BAJA DEFINITIVA"].includes(nuevo.estatus) && ["TRASPLANTADO","BAJA DEFINITIVA"].includes(antes?.estatus)) {
    batch.update(doc(db, "listas", nuevo.regL), { [`items.${nuevo.regK}.f`]: "L", [`items.${nuevo.regK}.bm`]: "", [`items.${nuevo.regK}.bf`]: "" });
  }
  batch.commit().catch(e => toast("Error al guardar: " + (e.code || e.message)));
  // No esperamos al servidor: con mala señal queda guardado en el equipo y se sube al volver la conexión.
  toast(S.online ? "Guardado" : "Guardado en el equipo · se subirá al volver la señal");
  return true;
}

    <label class="f">Resultado / acuerdo<textarea id="cO" rows="3" placeholder="Ej. cita cardio 15/11, no contesta, cambió de teléfono">${esc(p.observaciones || "")}</textarea></label>
    <label class="f">Estatus<select id="cE">${ESTATUS.map(e => `<option ${e===p.estatus?"selected":""}>${e}</option>`).join("")}</select></label>
    <label class="f">Motivo (si es diferido o baja)<select id="cM"><option value="">—</option>${[...MOTIVOS_DIF, ...MOTIVOS_BAJA.filter(x => !MOTIVOS_DIF.includes(x))].map(x => `<option ${x===p.motivo?"selected":""}>${x}</option>`).join("")}</select></label>
    <button class="btn pri block" id="cG">Guardar</button>`);

      fechaEstatus: est !== p.estatus ? iso(new Date()) : (p.fechaEstatus || "") };

    <div class="grid2">${inp("fnac","Fecha de nacimiento","date")}${inp("nss","NSS","text",'inputmode="numeric"')}
      ${inp("agregado","Agregado")}${sel("terapia","Terapia sustitutiva",TERAPIAS)}
      ${inp("tel1","Teléfono 1","tel")}${inp("tel2","Teléfono 2","tel")}
      ${inp("noTx","No. trasplante","text",'inputmode="numeric"')}${inp("etiologia","Etiología")}
      ${inp("fechaEstatus","Fecha de estatus","date")}${inp("revalorar","Revalorar el (si es diferido)","date")}
      ${inp("ultimoContacto","Último contacto","date")}</div>
    <label class="f">Observaciones<textarea data-k="observaciones" rows="3">${esc(p.observaciones || "")}</textarea></label>
    <div class="sec">Estudios (fecha de realización)</div><div class="grid2">${estF}</div>
    <button class="btn pri block" id="fG" style="margin-top:8px">${nuevo ? "Agregar paciente" : "Guardar cambios"}</button>
    ${!nuevo && S.rol === "admin" ? `<button class="btn danger block" id="fDel" style="margin-top:10px">Eliminar paciente</button>
      <div style="font-size:12px;color:var(--muted);margin-top:6px">Sugerencia: para bajas usa el estatus BAJA DEFINITIVA en vez de eliminar.</div>` : ""}`);
  const el = sh.el;
  el.querySelectorAll("[data-na]").forEach(c => c.onchange = () => { const d = el.querySelector(`[data-e="${c.dataset.na}"]`); d.disabled = c.checked; if (c.checked) d.value = ""; });
  el.querySelector("#fG").onclick = async () => {
    const n = { ...p, estudios: {} };
    el.querySelectorAll("[data-k]").forEach(i => n[i.dataset.k] = i.value.trim());
    el.querySelectorAll("[data-e]").forEach(i => { const k = i.dataset.e; n.estudios[k] = el.querySelector(`[data-na="${k}"]`).checked ? "NA" : i.value; });

    if (!n.nombre || !n.grupo || !n.estatus) return toast("Faltan nombre, grupo o estatus");
    if (/DIFERIDO|BAJA/.test(n.estatus) && !n.motivo) return toast("Elige el motivo del diferimiento o baja");
    if (!/DIFERIDO|BAJA/.test(n.estatus)) n.motivo = "";
    const dup = S.pacientes.find(x => x.nombre === n.nombre && x.id !== p.id);
    if (dup && !confirm("Ya existe un paciente con ese nombre. ¿Guardar de todos modos?")) return;
    if (!nuevo && n.estatus !== p.estatus && !n.fechaEstatus) n.fechaEstatus = iso(new Date());
    if (await guardar(nuevo ? null : p.id, n, nuevo ? "Paciente agregado" : "Datos modificados")) sh.close();
  };
  const del = el.querySelector("#fDel");
  if (del) del.onclick = async () => {
    if (!confirm(`¿Eliminar a ${p.nombre}? Quedará registrado en el historial con todos sus datos.`)) return;

    b.commit().catch(e => toast("Error: " + e.code)); sh.close(); toast("Paciente eliminado");
  };

function descargar(nombre, contenido, tipo) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([contenido], { type: tipo })); a.download = nombre; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function exportCSV() {
  const cols = ["grupo","nombre","fnac","nss","agregado","tel1","tel2","noTx","etiologia","terapia","estatus","motivo","fechaEstatus","revalorar"];
  const head = [...cols.map(c => CAMPOS_LABEL[c]), "Alerta protocolo", "Próx. vencimiento", ...ESTUDIOS.map(e => e[1]), "Último contacto", "Observaciones"];
  const q = v => `"${String(v ?? "").replace(/"/g,'""')}"`;
  const rows = ordenar([...S.pacientes]).map(p => { const pr = protocolo(p);
    return [...cols.map(c => /fnac|fecha|revalorar/i.test(c) ? fmt(p[c]) : p[c]), pr.alerta, fmtD(pr.prox), ...ESTUDIOS.map(([k]) => fmt(p.estudios?.[k])), fmt(p.ultimoContacto), p.observaciones].map(q).join(","); });
  descargar(`lista_espera_${iso(new Date())}.csv`, "﻿" + [head.map(q).join(","), ...rows].join("\n"), "text/csv");
}
async function importar(ev) {
  const f = ev.target.files[0]; if (!f) return;
  let arr; try { arr = JSON.parse(await f.text()); } catch { return toast("Archivo no válido"); }
  if (!Array.isArray(arr) && arr && arr.listas) { ev.target.value = ""; return importarListas(arr); }
  if (!Array.isArray(arr)) return toast("El archivo debe ser una lista de pacientes");
  const existentes = new Set(S.pacientes.map(p => p.nombre));
  const nuevos = arr.filter(p => p.nombre && p.grupo && !existentes.has(p.nombre.trim().toUpperCase()));
  if (!confirm(`Se agregarán ${nuevos.length} pacientes (${arr.length - nuevos.length} ya existen y se omiten). ¿Continuar?`)) return;
  for (let i = 0; i < nuevos.length; i += 200) {
    const b = writeBatch(db);
    for (const p of nuevos.slice(i, i + 200)) {
      const ref = doc(collection(db, "pacientes"));
      const n = { ...migrar(p), nombre: p.nombre.trim().toUpperCase(), estudios: p.estudios || {}, actualizado: serverTimestamp(), actualizadoPor: S.user.email };
      b.set(ref, n);
      b.set(doc(collection(db, "historial")), { pacienteId: ref.id, nombre: n.nombre, accion: "Importado", cambios: {}, por: S.user.email, fecha: serverTimestamp() });
    }
    await b.commit();
  }
  toast(`${nuevos.length} pacientes importados`); ev.target.value = "";
}

I.prot = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>';

// ===================== LISTAS DE ESPERA (registro completo) =====================
// Cada lista es un documento en "listas" con un mapa items: { clave: registro }.
// Fases: E = en espera de turno · P = en protocolo · L = protocolo terminado (pasa a "Listos") · B = baja.
// El lugar en lista se recalcula solo: se cuentan todos los que NO están dados de baja, en orden de registro.
const LISTAS = [
  ["CAD_OP","O+","Cadáver O+"],["CAD_AP","A+","Cadáver A+"],["CAD_BP","B+","Cadáver B+"],["CAD_ABP","AB+","Cadáver AB+"],
  ["CAD_ON","O-","Cadáver O−"],["CAD_AN","A-","Cadáver A−"],["CAD_BN","B-","Cadáver B−"],["CAD_ABN","AB-","Cadáver AB−"],
  ["VIVO","","Donador vivo"]
];
const LST = Object.fromEntries(LISTAS.map(([id,g,n]) => [id, { id, g, n }]));
const LST_DE_GRUPO = Object.fromEntries(LISTAS.filter(l => l[1]).map(([id,g]) => [g, id]));
const FASE = { E:"EN ESPERA DE TURNO", P:"EN PROTOCOLO", L:"PROTOCOLO TERMINADO", B:"BAJA" };
const FASE_CLS = { E:"t-gray", P:"t-info", L:"t-ok", B:"t-bad" };
const MOTIVOS_BAJA_REG = ["Trasplante","Defunción","Cambio de hospital","No desea trasplantarse","Contraindicación definitiva","Migrado a cadáver","Otro"];
const REG_LABEL = { n:"Nombre", id:"ID CENATRA", nss:"NSS", curp:"CURP", fnac:"Fecha nacimiento", fr:"Fecha de registro", res:"Residencia", tel:"Teléfonos", mail:"Correo",
  est:"Estatus (texto)", obs:"Observaciones", f:"Fase", ip:"Inicio de protocolo", bm:"Motivo de baja", bf:"Fecha de baja", don:"Donador", par:"Parentesco", mod:"Modalidad", gpo:"Grupo", sx:"Sexo", adsc:"Adscripción" };
S.reg = {}; S.pos = {}; S.lst = "CAD_OP"; S.q2 = ""; S.verBajas = false; S.lim = 150; S.fProt = ""; S.mas = "resumen";

function recalcPos() {
  S.pos = {};
  for (const [L] of LISTAS) {
    const it = Object.entries(S.reg[L] || {}).filter(([,r]) => r.f !== "B").sort((a,b) => (a[1].o||0) - (b[1].o||0));
    S.pos[L] = { total: it.length, map: Object.fromEntries(it.map(([k], i) => [k, i + 1])) };
  }
}
const lugar = (L, k) => S.pos[L]?.map[k] || null;
const regs = L => Object.entries(S.reg[L] || {}).map(([k, r]) => ({ ...r, k, L }));
const todos = () => LISTAS.flatMap(([L]) => regs(L));
const nrm = s => String(s || "").toLowerCase().normalize("NFD").replace(/\p{Diacritic}/gu, "");

function subscribeListas() {
  for (const [L] of LISTAS) {
    S.unsub.push(onSnapshot(doc(db, "listas", L), s => { S.reg[L] = (s.data() || {}).items || {}; recalcPos(); if (["espera","protocolo","lista","elegibles","mas"].includes(S.tab)) render(); }, () => {}));
  }
}

// Teléfonos escritos libremente → botones de llamada con su etiqueta (PAC, MAMÁ, etc.)
function telsDe(txt) {
  const out = []; const re = /(\+?\d[\d\s\-().]{6,18}\d)\s*([A-Za-zÁÉÍÓÚÑáéíóúñ.()]+(?:\s[A-Za-zÁÉÍÓÚÑáéíóúñ.()]+)?)?/g; let m;
  while ((m = re.exec(String(txt || ""))) && out.length < 8) { const d = m[1].replace(/\D/g, ""); if (d.length >= 7 && d.length <= 12) out.push({ d, n: m[1].trim(), et: (m[2] || "").trim() }); }
  return out;
}
function regTelLinks(r) {
  const t = telsDe(r.tel);
  if (!t.length) return r.tel ? `<div class="meta" style="margin-top:8px">${esc(r.tel)}</div>` : `<div class="meta" style="margin-top:8px">Sin teléfono registrado</div>`;
  return `<div class="calls" style="flex-wrap:wrap">${t.map(x => `<a class="callbtn" style="flex:1 1 45%" href="tel:${x.d}" onclick="event.stopPropagation()">${I.phone}<span>${esc(x.n)}${x.et ? `<br><small style="font-weight:400">${esc(x.et)}</small>` : ""}</span></a>`).join("")}</div>`;
}

function regCard(r, mostrarLista = false) {
  const pos = lugar(r.L, r.k);
  return `<div class="card" data-reg="${esc(r.L)}|${esc(r.k)}"><div class="pt">
    <div class="gb" style="min-width:58px;font-size:${pos && pos > 999 ? 13 : 15}px">${r.f === "B" ? "—" : "#" + pos}</div>
    <div class="info"><div class="name">${esc(r.n)}</div>
      <div class="meta">${[mostrarLista ? LST[r.L].n : "", r.id ? "ID " + r.id : "", r.fr ? "Reg. " + fmt(r.fr) : "", r.L === "VIVO" && r.don ? "Donador: " + r.don : ""].filter(Boolean).map(esc).join(" · ")}</div>
      <div class="tags"><span class="tag ${FASE_CLS[r.f]}">${FASE[r.f]}${r.f === "B" && r.bm ? " · " + esc(r.bm) : ""}</span>${r.est ? `<span class="tag t-gray">${esc(r.est.slice(0, 40))}</span>` : ""}${r.nota ? `<span class="tag t-warn">${esc(r.nota)}</span>` : ""}</div>
    </div></div></div>`;
}
function bindRegs(root) { root.querySelectorAll(".card[data-reg]").forEach(c => c.onclick = () => { const [L, k] = c.dataset.reg.split("|"); openReg(L, k); }); }

function vEspera(m) {
  if (!S.q2.trim() && S.lst.startsWith("HIST_")) return vHist(m);
  if (PC()) return vEsperaPC(m);
  const q = nrm(S.q2).trim();
  let arr, titulo;
  if (q) {
    arr = todos().filter(r => (S.verBajas || r.f !== "B") && (nrm(r.n).includes(q) || String(r.id || "").includes(q) || String(r.nss || "").replace(/\D/g, "").includes(q.replace(/\D/g, "") || "~") || nrm(r.curp).includes(q)));
    titulo = `${arr.length} resultado${arr.length === 1 ? "" : "s"} en todas las listas`;
  } else {
    arr = regs(S.lst).filter(r => S.verBajas || r.f !== "B");
    titulo = `${LST[S.lst].n} · ${S.pos[S.lst]?.total || 0} en lista`;
  }
  arr.sort((a,b) => (a.L === b.L ? 0 : LISTAS.findIndex(l => l[0] === a.L) - LISTAS.findIndex(l => l[0] === b.L)) || (a.f === "B") - (b.f === "B") || (a.o || 0) - (b.o || 0));
  const vis = arr.slice(0, S.lim);
  const cnt = L => S.pos[L]?.total || 0;
  m.innerHTML = `<div class="search"><input id="q2" type="search" placeholder="Buscar en todas las listas: nombre, ID CENATRA, NSS o CURP" value="${esc(S.q2)}"></div>
    <div class="chips">${LISTAS.map(([L,,n]) => `<button class="chip ${!q && S.lst===L?"on":""}" data-l="${L}">${n.replace("Cadáver ","")} <b>${cnt(L)}</b></button>`).join("")}${histChips(q)}</div>
    <div class="row" style="justify-content:space-between;align-items:center"><div class="sec" style="margin:8px 2px">${esc(titulo)}</div>
      <label style="font-size:12px;color:var(--muted)"><input type="checkbox" id="vb" ${S.verBajas?"checked":""}> Ver bajas</label></div>
    ${!Object.keys(S.reg).length ? `<div class="empty">Cargando listas…</div>` : vis.length ? vis.map(r => regCard(r, !!q)).join("") : `<div class="empty">Sin registros.</div>`}
    ${arr.length > vis.length ? `<button class="btn block" id="mas">Mostrar más (${arr.length - vis.length} restantes)</button>` : ""}
    ${q ? histBusquedaHTML(q) : ""}`;
  const qi = m.querySelector("#q2");
  qi.oninput = () => { S.q2 = qi.value; S.lim = 150; const pos = qi.selectionStart; render(); const n = document.getElementById("q2"); n.focus(); n.setSelectionRange(pos, pos); };
  m.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { S.lst = b.dataset.l; S.q2 = ""; S.lim = 150; render(); });
  m.querySelector("#vb").onchange = e => { S.verBajas = e.target.checked; render(); };
  const mb = m.querySelector("#mas"); if (mb) mb.onclick = () => { S.lim += 300; render(); };
  bindRegs(m); bindHist(m);
}

function vProtocolo(m) {
  if (PC()) return vProtocoloPC(m);
  const hoyD = hoy();
  let arr = todos().filter(r => r.f === "P" && (!S.fProt || (S.fProt === "VIVO" ? r.L === "VIVO" : r.L !== "VIVO")));
  arr.sort((a,b) => (a.ip || "9999").localeCompare(b.ip || "9999") || (a.o || 0) - (b.o || 0));
  const dias = r => r.ip ? Math.round((hoyD - parse(r.ip)) / 864e5) : null;
  m.innerHTML = `<div class="notice" style="background:var(--infobg);color:var(--info)">Pacientes con protocolo <b>en curso</b>. Siguen en su lista de espera con su número. Los que llevan más tiempo aparecen primero, para ver a quién hay que agilizar.</div>

}

// Guarda cambios de un registro (funciona sin señal: se sube al volver la conexión)
function regGuardar(L, k, cambiosObj, accion, extraBatch) {
  const antes = S.reg[L]?.[k] || {}; const upd = {}, cambios = {};
  for (const [c, v0] of Object.entries(cambiosObj)) {
    const v = typeof v0 === "string" && !["f","mail","bm"].includes(c) ? v0.toUpperCase() : v0;
    if ((antes[c] ?? "") === (v ?? "")) continue;
    upd[`items.${k}.${c}`] = v;
    const fmtv = x => c === "f" ? (FASE[x] || x || "") : String(x ?? "");
    cambios[REG_LABEL[c] || c] = [fmtv(antes[c]), fmtv(v)];
  }
  if (!Object.keys(upd).length && !extraBatch) { toast("Sin cambios"); return; }
  const b = writeBatch(db);
  if (Object.keys(upd).length) b.update(doc(db, "listas", L), upd);
  b.set(doc(collection(db, "historial")), { pacienteId: `${L}:${k}`, nombre: cambiosObj.n || antes.n, accion, cambios, por: S.user.email, fecha: serverTimestamp() });
  if (extraBatch) extraBatch(b);
  b.commit().catch(e => toast("Error al guardar: " + (e.code || e.message)));
  toast(S.online ? "Guardado" : "Guardado en el equipo · se subirá al volver la señal");
}
const nuevaClave = () => "n" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
const ultimoOrden = L => Math.max(0, ...Object.values(S.reg[L] || {}).map(r => r.o || 0));

function regForm(L, k) {
  const nuevo = !k; const r = nuevo ? { f: "E", fr: iso(new Date()) } : { ...S.reg[L][k] };
  let lista = L; const vivo = () => lista === "VIVO";
  const campos = () => [["n","Nombre completo *"],["id","ID CENATRA"],["nss","NSS"],["curp","CURP"],["fnac","Fecha de nacimiento","date"],["res","Residencia"],
    ...(vivo() ? [["gpo","Grupo sanguíneo"],["sx","Sexo"],["mod","Modalidad (HD/DP…)"],["adsc","Adscripción"],["don","Donador"],["par","Parentesco"]] : []),
    ["mail","Correo","email"],["est","Estatus (texto libre)"],["nota","Aviso destacado (ej. VERIFICAR GRUPO)"]];
  const html = () => `${nuevo ? `<label class="f">Lista *<select id="rl">${LISTAS.map(([id,,n]) => `<option value="${id}" ${id===lista?"selected":""}>${n}</option>`).join("")}</select></label>

    <label class="f">Teléfonos (con etiqueta: 477 123 45 67 PACIENTE · 477 … MAMÁ)<textarea data-c="tel" rows="3">${esc(r.tel || "")}</textarea></label>
    <label class="f">Observaciones<textarea data-c="obs" rows="4">${esc(r.obs || "")}</textarea></label>
    <button class="btn pri block" id="rg">${nuevo ? "Registrar en lista" : "Guardar cambios"}</button>`;
  const sh = sheet(nuevo ? "Nuevo registro en lista" : "Editar registro", html());
  const bind = () => {
    const sel = sh.el.querySelector("#rl"); if (sel) sel.onchange = () => { sh.el.querySelectorAll("[data-c]").forEach(i => r[i.dataset.c] = i.value); lista = sel.value; sh.el.querySelector(".sh-body").innerHTML = html(); bind(); };
    sh.el.querySelector("#rg").onclick = () => {
      const v = {}; sh.el.querySelectorAll("[data-c]").forEach(i => v[i.dataset.c] = i.value.trim());
      for (const c in v) if (c !== "mail") v[c] = v[c].toUpperCase(); if (!v.n) return toast("Falta el nombre");
      if (nuevo) {
        const dup = todos().find(x => x.f !== "B" && ((v.id && x.id === v.id) || nrm(x.n) === nrm(v.n)));
        if (dup && !confirm(`Ya existe ${dup.n} en ${LST[dup.L].n} (lugar ${lugar(dup.L, dup.k) || "—"}). ¿Registrar de todos modos?`)) return;
        const kk = nuevaClave();
        const b = writeBatch(db);
        b.set(doc(db, "listas", lista), { items: { [kk]: { ...v, f: "E", fr: iso(new Date()), o: ultimoOrden(lista) + 1 } } }, { merge: true });
        b.set(doc(collection(db, "historial")), { pacienteId: `${lista}:${kk}`, nombre: v.n, accion: `Registrado en ${LST[lista].n}`, cambios: {}, por: S.user.email, fecha: serverTimestamp() });
        b.commit().catch(e => toast("Error: " + (e.code || e.message)));
        toast(`Registrado al final de ${LST[lista].n}`); sh.close();
      } else { regGuardar(L, k, v, "Datos modificados"); sh.close(); }
    };
  };
  bind();
}

// Carga inicial de las listas desde el archivo preparado a partir del Excel (solo administrador)
async function importarListas(obj) {
  if (S.rol !== "admin") return toast("Solo el administrador puede importar listas");
  const ya = LISTAS.reduce((n, [L]) => n + Object.keys(S.reg[L] || {}).length, 0);
  const nuevos = Object.values(obj.listas).reduce((n, it) => n + Object.keys(it).length, 0);
  if (!confirm(`Se cargarán ${nuevos} registros en ${Object.keys(obj.listas).length} listas${ya ? ` (ya hay ${ya}; los que tengan la misma clave se reemplazan)` : ""} y se enlazarán ${obj.links?.length || 0} pacientes de Listos. ¿Continuar?`)) return;
  const b = writeBatch(db);
  for (const [L, items] of Object.entries(obj.listas)) b.set(doc(db, "listas", L), { items }, { merge: true });
  const dg = s => String(s || "").replace(/\D/g, "");
  let enl = 0;
  for (const l of obj.links || []) {
    const p = S.pacientes.find(x => (dg(l.nss).length >= 9 && dg(x.nss).startsWith(dg(l.nss).slice(0, 9))) || nrm(x.nombre) === nrm(l.nombre));
    if (!p) continue; enl++;
    const t = telsDe(l.telExcel);
    const upd = { regL: l.regL, regK: l.regK, idCenatra: l.idCenatra || "", curp: l.curp || "", fechaRegistro: l.fechaRegistro || "" };
    if (!p.tel1 && t[0]) upd.tel1 = t[0].d; if (!p.tel2 && t[1]) upd.tel2 = t[1].d;
    b.update(doc(db, "pacientes", p.id), upd);
  }
  b.set(doc(collection(db, "historial")), { pacienteId: "listas", nombre: "Listas de espera", accion: `Carga inicial desde Excel LISTA DE ESPERA 2026 (${nuevos} registros, ${enl} pacientes enlazados)`, cambios: {}, por: S.user.email, fecha: serverTimestamp() });
  try { await b.commit(); toast(`Listas cargadas: ${nuevos} registros · ${enl} enlazados`); } catch (e) { toast("Error: " + (e.code || e.message)); }
}

const LEYENDA = [["c-pro","En protocolo"],["c-ok","Protocolo completo / Listos"],["c-ver","Verificar"],["c-ci","Contraindicado temporal"],["c-nl","No localizable / no contesta"],["c-baja","Baja"]];
const leyenda = (keys) => `<div class="ley">${LEYENDA.filter(([c]) => !keys || keys.includes(c)).map(([c,t]) => `<span><i class="${c}"></i>${t}</span>`).join("")}</div>`;
function colorReg(r) {
  const t = `${r.est || ""} ${r.nota || ""} ${r.obs || ""}`.toUpperCase();
  if (r.f === "B") return "c-baja";
  if (/VERIFICAR|CORROBORAR/.test(`${r.est || ""} ${r.nota || ""}`.toUpperCase())) return "c-ver";
  if (r.f === "P") return "c-pro";
  if (r.f === "L") return "c-ok";
  if (/CONTRAINDICA/.test(r.est || "")) return "c-ci";
  if (/NO LOCALIZ|NO CONTEST|NO RESPOND/.test((r.est || "").toUpperCase())) return "c-nl";
  return "";
}
function colorPac(p) {
  if (["BAJA DEFINITIVA","TRASPLANTADO"].includes(p.estatus)) return "c-baja";
  if (p.estatus === "EN PROTOCOLO") return "c-pro";
  if (p.estatus === "DIFERIDO TEMPORAL") return p.motivo === "No localizado" ? "c-nl" : "c-ci";
  if (p.estatus === "ACTIVO") return "c-ok";
  return "";
}
const tdx = (v, cls = "") => { const t = esc(v ?? ""); return /\b(obs|tel|est|nom2)\b/.test(cls) && t ? `<td class="${cls}"><div class="cl" title="${t}">${t}</div></td>` : `<td${cls ? ` class="${cls}"` : ""}>${t}</td>`; };
const ANCHO = { "No":46, "#":40, "LUGAR":52, "ID":66, "LISTA":64, "GPO":46, "NOMBRE":210, "NSS":150, "F. REGISTRO":84, "F. RECEPCIÓN":84, "RESIDENCIA":86, "CIUDAD":86, "CURP":160, "EDAD":44, "SEXO":40,
  "ADSC.":46, "MOD":50, "DONADOR":170, "PARENTESCO":90, "TELÉFONOS":175, "ESTATUS":135, "FASE":105, "INICIO PROTOCOLO":88, "DÍAS":48, "TERAPIA":60, "TX #":42, "PROTOCOLO":95, "VENCE":84, "ÚLT. CONTACTO":88 };
const thead = head => `<colgroup>${head.map(h => `<col style="width:${ANCHO[h] ? ANCHO[h] + "px" : "auto"}">`).join("")}</colgroup><thead><tr>${head.map(h => `<th title="${h}">${h}</th>`).join("")}</tr></thead>`;
const telsTxt = s => telsDe(s).map(x => x.n + (x.et ? " " + x.et : "")).join(" · ") || String(s || "");

function tablaRegs(arr, conLista) {
  const vivo = !conLista && arr.length && arr.every(r => r.L === "VIVO");
  const head = vivo
    ? ["#","NOMBRE","NSS","SEXO","F. RECEPCIÓN","ADSC.","GPO","CIUDAD","DONADOR","PARENTESCO","MOD","TELÉFONOS","ESTATUS","INICIO PROTOCOLO","OBSERVACIONES"]
    : [...(conLista ? ["LISTA"] : []), "No","ID","NOMBRE","NSS","F. REGISTRO","RESIDENCIA","CURP","EDAD","TELÉFONOS","ESTATUS","FASE","OBSERVACIONES"];
  const fila = r => {
    const pos = lugar(r.L, r.k); const no = r.f === "B" ? "—" : pos;
    const est = [r.est, r.f === "B" && r.bm ? "BAJA: " + r.bm : ""].filter(Boolean).join(" · ");
    const obs = [r.nota, r.obs].filter(Boolean).join(" · ");
    const cells = vivo
      ? [tdx(no,"num"), tdx(r.n,"nom"), tdx(r.nss,"nw"), tdx(r.sx), tdx(r.fr ? fmt(r.fr) : "","nw"), tdx(r.adsc), tdx(r.gpo,"nw"), tdx(r.res), tdx(r.don,"nom2"), tdx(r.par), tdx(r.mod),
         tdx(telsTxt(r.tel),"tel"), tdx(est,"est"), tdx(r.ip ? fmt(r.ip) : "","nw"), tdx(obs,"obs")]
      : [...(conLista ? [tdx(LST[r.L].n.replace("Cadáver ",""),"nw")] : []), tdx(no,"num"), tdx(r.id,"nw"), tdx(r.n,"nom"), tdx(r.nss,"nw"), tdx(r.fr ? fmt(r.fr) : "","nw"), tdx(r.res),
         tdx(r.curp,"nw"), tdx(edad(r.fnac),"num"), tdx(telsTxt(r.tel),"tel"), tdx(est,"est"), tdx(r.f === "E" ? "" : FASE[r.f],"nw"), tdx(obs,"obs")];
    return `<tr class="${colorReg(r)}" data-reg="${esc(r.L)}|${esc(r.k)}">${cells.join("")}</tr>`;
  };
  return `<div class="tbl-wrap"><table class="xl">${thead(head)}<tbody>${arr.map(fila).join("")}</tbody></table></div>`;
}
function bindTabla(root) {
  root.querySelectorAll("tr[data-reg]").forEach(tr => tr.onclick = () => { const [L, k] = tr.dataset.reg.split("|"); openReg(L, k); });
  root.querySelectorAll("tr[data-id]").forEach(tr => tr.onclick = () => openFicha(tr.dataset.id));
}

function vEsperaPC(m) {
  const q = nrm(S.q2).trim();
  let arr;
  if (q) arr = todos().filter(r => (S.verBajas || r.f !== "B") && (nrm(r.n).includes(q) || String(r.id || "").includes(q) || String(r.nss || "").replace(/\D/g, "").includes(q.replace(/\D/g, "") || "~") || nrm(r.curp).includes(q)));
  else arr = regs(S.lst).filter(r => S.verBajas || r.f !== "B");
  arr.sort((a,b) => (a.L === b.L ? 0 : LISTAS.findIndex(l => l[0] === a.L) - LISTAS.findIndex(l => l[0] === b.L)) || (a.f === "B") - (b.f === "B") || (a.o || 0) - (b.o || 0));
  const cnt = L => S.pos[L]?.total || 0;
  m.innerHTML = `<div class="pc-bar"><div class="search" style="flex:1;margin:0"><input id="q2" type="search" placeholder="Buscar en todas las listas: nombre, ID CENATRA, NSS o CURP" value="${esc(S.q2)}"></div>
      <label class="vb"><input type="checkbox" id="vb" ${S.verBajas?"checked":""}> Ver bajas</label>${puedeEditar() ? `<button class="btn" id="xlsx">Descargar Excel completo</button><button class="btn pri" id="nuevoReg">+ Registrar paciente</button>` : ""}</div>
    <div class="chips">${LISTAS.map(([L,,n]) => `<button class="chip ${!q && S.lst===L?"on":""}" data-l="${L}">${n.replace("Cadáver ","")} <b>${cnt(L)}</b></button>`).join("")}${histChips(q)}</div>
    <div class="pc-bar"><div class="sec" style="margin:4px 2px">${q ? `${arr.length} resultado${arr.length===1?"":"s"} en todas las listas` : `${esc(LST[S.lst].n)} · ${cnt(S.lst)} en lista`}</div>${leyenda()}</div>
    ${!Object.keys(S.reg).length ? `<div class="empty">Cargando listas…</div>` : arr.length ? tablaRegs(arr, !!q) : `<div class="empty">Sin registros.</div>`}
    ${q ? histBusquedaHTML(q) : ""}`;
  const qi = m.querySelector("#q2");
  qi.oninput = () => { S.q2 = qi.value; const pos = qi.selectionStart; render(); const n = document.getElementById("q2"); n.focus(); n.setSelectionRange(pos, pos); };
  m.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { S.lst = b.dataset.l; S.q2 = ""; render(); scrollTo(0,0); });
  m.querySelector("#vb").onchange = e => { S.verBajas = e.target.checked; render(); };
  const nb = m.querySelector("#nuevoReg"); if (nb) nb.onclick = () => regForm(S.lst, null);
  const xb = m.querySelector("#xlsx"); if (xb) xb.onclick = exportarExcelCompleto;
  bindTabla(m); bindHist(m);
}

function vProtocoloPC(m) {
  const hoyD = hoy();
  const sel = r => r.f === "P" && (!S.fProt || (S.fProt === "VIVO" ? r.L === "VIVO" : r.L !== "VIVO"));
  const arr = todos().filter(sel).sort((a,b) => (a.ip || "9999").localeCompare(b.ip || "9999") || (a.o || 0) - (b.o || 0));
  const dias = r => r.ip ? Math.round((hoyD - parse(r.ip)) / 864e5) : null;
  const head = ["LISTA","No","ID","NOMBRE","NSS","INICIO PROTOCOLO","DÍAS","DONADOR","TELÉFONOS","ESTATUS","OBSERVACIONES"];
  m.innerHTML = `<div class="notice" style="background:var(--infobg);color:var(--info)">Pacientes con protocolo <b>en curso</b>. Siguen en su lista de espera con su número. Los que llevan más tiempo aparecen primero.</div>
    <div class="chips">${[["","Todos"],["CAD","Cadáver"],["VIVO","Donador vivo"]].map(([k,l]) => `<button class="chip ${S.fProt===k?"on":""}" data-p="${k}">${l} <b>${todos().filter(r => r.f === "P" && (!k || (k === "VIVO" ? r.L === "VIVO" : r.L !== "VIVO"))).length}</b></button>`).join("")}</div>
    ${arr.length ? `<div class="tbl-wrap"><table class="xl">${thead(head)}<tbody>${arr.map(r => { const d = dias(r); return `<tr class="${colorReg(r)}" data-reg="${esc(r.L)}|${esc(r.k)}">${[
      tdx(LST[r.L].n.replace("Cadáver ",""),"nw"), tdx(lugar(r.L, r.k),"num"), tdx(r.id,"nw"), tdx(r.n,"nom"), tdx(r.nss,"nw"), tdx(r.ip ? fmt(r.ip) : "Sin fecha","nw"),
      `<td class="num ${d === null ? "" : d > 180 ? "d-bad" : d > 90 ? "d-warn" : ""}">${d ?? "—"}</td>`, tdx(r.don,"nom2"), tdx(telsTxt(r.tel),"tel"), tdx(r.est,"est"), tdx([r.nota, r.obs].filter(Boolean).join(" · "),"obs")].join("")}</tr>`; }).join("")}</tbody></table></div>` : `<div class="empty">Sin pacientes en protocolo.</div>`}`;
  m.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { S.fProt = b.dataset.p; render(); });
  bindTabla(m);
}

function tablaPacientes(arr) {
  const head = ["GPO","LUGAR","ID","NOMBRE","EDAD","TERAPIA","TX #","ESTATUS","PROTOCOLO","VENCE","TELÉFONOS","ÚLT. CONTACTO","OBSERVACIONES"];
  return `<div class="tbl-wrap"><table class="xl">${thead(head)}<tbody>${arr.map(p => { const pr = protocolo(p);
    return `<tr class="${colorPac(p)}" data-id="${esc(p.id)}">${[tdx(p.grupo,"nw"), tdx(p.regL ? lugar(p.regL, p.regK) : "","num"), tdx(p.idCenatra,"nw"), tdx(p.nombre,"nom"), tdx(edad(p.fnac),"num"), tdx(p.terapia),
      tdx(p.noTx,"num"), tdx(p.estatus + (p.motivo && /DIFERIDO|BAJA/.test(p.estatus) ? " · " + p.motivo : ""),"est"),
      `<td class="nw ${pr.alerta === "CADUCADO" ? "d-bad" : pr.alerta === "POR VENCER" ? "d-warn" : ""}">${pr.alerta !== "—" ? esc(pr.alerta) : ""}</td>`, tdx(pr.prox && pr.alerta !== "—" ? fmtD(pr.prox) : "","nw"),
      tdx([p.tel1, p.tel2].filter(Boolean).join(" · "),"tel"), tdx(p.ultimoContacto ? fmt(p.ultimoContacto) : "","nw"), tdx(p.observaciones,"obs")].join("")}</tr>`; }).join("")}</tbody></table></div>`;
}
// ===================== FIN VISTA DE COMPUTADORA =====================
// ===================== BAJAS HISTÓRICAS (copia fiel del Excel) Y DESCARGA PARA AUDITORÍA =====================
const HIST = [["HIST_CAD","Bajas cadáver"],["HIST_VIVO","Bajas vivo"],["HIST_TEMP","Bajas temporales"],["HIST_HOSP","Cambio de hospital"]];
const HIST_N = Object.fromEntries(HIST);
S.hist = {};
const MAY = s => typeof s === "string" ? s.toUpperCase() : s;
function subscribeHist() {
  for (const [H] of HIST) S.unsub.push(onSnapshot(doc(db, "listas", H), s => { S.hist[H] = s.data() || null; if (S.tab === "espera") render(); }, () => {}));
}
const histRows = H => Object.entries(S.hist[H]?.items || {}).map(([k, e]) => ({ ...e, k, H })).filter(e => !e.h).sort((a, b) => (a.o || 0) - (b.o || 0));
const histChips = q => HIST.map(([H, n]) => `<button class="chip chip-h ${!q && S.lst === H ? "on" : ""}" data-l="${H}">${n} <b>${histRows(H).length}</b></button>`).join("");
function histBuscar(q) {
  const d = q.replace(/\D/g, "");
  return HIST.flatMap(([H]) => histRows(H).filter(e => nrm(e.n).includes(q) || (d.length >= 4 && ((e.id || "").includes(d) || String(e.nss || "").replace(/\D/g, "").includes(d)))));
}
const histResto = e => { const cols = S.hist[e.H]?.cols || []; return (e.c || []).map((v, i) => [cols[i] || "", v]).filter(([c, v]) => v && !/^(No|#|ID|NOMBRE|NSS)$/.test(c)).map(([, v]) => v).join(" · "); };
function histCard(e, conLista = false) {
  return `<div class="card" data-hist="${esc(e.H)}|${esc(e.k)}" style="cursor:pointer"><div class="pt">
    <div class="gb" style="min-width:58px;background:#8a93a3;font-size:12px">BAJA</div>
    <div class="info"><div class="name">${esc(e.n)}</div>
      <div class="meta">${[conLista ? HIST_N[e.H] + " (Excel)" : "", e.id ? "ID " + e.id : "", e.nss ? "NSS " + e.nss : ""].filter(Boolean).map(esc).join(" · ")}</div>
      <div class="meta" style="display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;margin-top:4px">${esc(histResto(e))}</div></div></div></div>`;
}
function histBusquedaHTML(q) {
  const r = histBuscar(q); if (!r.length) return "";
  return `<div class="sec">En bajas históricas del Excel · ${r.length}</div><div class="${PC() ? "cgrid" : ""}">${r.slice(0, 60).map(e => histCard(e, true)).join("")}</div>`;
}
function histTabla(arr, H) {
  const cols = S.hist[H]?.cols || [];
  const w = c => c === "NOMBRE" ? 210 : /^(No|#)$/.test(c) ? 44 : /OBSERV|COL /.test(c) ? 170 : /DONADOR|TELÉF|CURP/.test(c) ? 160 : 100;
  const tot = cols.reduce((s, c) => s + w(c), 0);
  return `<div class="tbl-wrap"><table class="xl" style="min-width:${tot}px"><colgroup>${cols.map(c => `<col style="width:${w(c)}px">`).join("")}</colgroup>
    <thead><tr>${cols.map(c => `<th title="${esc(c)}">${esc(c)}</th>`).join("")}</tr></thead>
    <tbody>${arr.map(e => `<tr class="c-baja-h" data-hist="${esc(H)}|${esc(e.k)}">${cols.map((c, i) => { const v = esc(e.c?.[i] || ""); return c === "NOMBRE" ? `<td class="nom">${v}</td>` : `<td>${v ? `<div class="cl" title="${v}">${v}</div>` : ""}</td>`; }).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function bindHist(root) { root.querySelectorAll("[data-hist]").forEach(x => x.onclick = () => { const [H, k] = x.dataset.hist.split("|"); openHist(H, k); }); }
function openHist(H, k) {
  const e = S.hist[H]?.items?.[k]; if (!e) return; const cols = S.hist[H].cols || [];
  sheet(esc(e.n || "Registro"), `<div class="notice" style="background:var(--graybg);color:var(--gray)">Registro histórico copiado tal cual de la hoja <b>${esc(S.hist[H].hoja)}</b> del Excel. Solo consulta.</div>
    <div class="card">${(e.c || []).map((v, i) => v ? `<div style="padding:6px 0;border-bottom:1px solid var(--line)"><small style="color:var(--muted);display:block;font-size:11px">${esc(cols[i] || "Columna " + (i + 1))}</small><div style="white-space:pre-wrap">${esc(v)}</div></div>` : "").join("")}</div>`);
}
function vHist(m) {
  const H = S.lst, d = S.hist[H], pc = PC(), arr = histRows(H);
  const cnt = L => S.pos[L]?.total || 0; const vis = pc ? arr : arr.slice(0, S.lim);
  m.innerHTML = `<div class="${pc ? "pc-bar" : ""}"><div class="search" style="${pc ? "flex:1;margin:0" : ""}"><input id="q2" type="search" placeholder="Buscar en todas las listas: nombre, ID CENATRA, NSS o CURP" value=""></div>
      ${pc && puedeEditar() ? `<button class="btn" id="xlsx">Descargar Excel completo</button>` : ""}</div>
    <div class="chips">${LISTAS.map(([L,,n]) => `<button class="chip" data-l="${L}">${n.replace("Cadáver ","")} <b>${cnt(L)}</b></button>`).join("")}${histChips("")}</div>
    <div class="notice" style="background:var(--graybg);color:var(--gray)">${esc(HIST_N[H])} · copia fiel de la hoja <b>${esc(d?.hoja || "")}</b> del Excel original (solo consulta, para auditoría). No cuentan en los lugares de la lista. Las bajas nuevas se registran en cada lista con "Dar de baja".</div>
    ${!d ? `<div class="empty">${d === null ? "Sin registros." : "Cargando…"}</div>` : pc ? histTabla(arr, H) : vis.map(e => histCard(e)).join("") + (arr.length > vis.length ? `<button class="btn block" id="mas">Mostrar más (${arr.length - vis.length} restantes)</button>` : "")}`;
  const qi = m.querySelector("#q2");
  qi.oninput = () => { S.q2 = qi.value; const pos = qi.selectionStart; render(); const n = document.getElementById("q2"); n.focus(); n.setSelectionRange(pos, pos); };
  m.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { S.lst = b.dataset.l; S.q2 = ""; S.lim = 150; render(); scrollTo(0,0); });
  const mb = m.querySelector("#mas"); if (mb) mb.onclick = () => { S.lim += 300; render(); };
  const xb = m.querySelector("#xlsx"); if (xb) xb.onclick = exportarExcelCompleto;
  bindHist(m);
}

// Descarga de todo (listas activas con sus bajas, Listos y bajas históricas) en un solo Excel, una hoja por lista
let XLSX_LIB = null;
function cargarXLSX() {
  if (XLSX_LIB) return XLSX_LIB;
  XLSX_LIB = new Promise((ok, mal) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.onload = () => ok(window.XLSX); s.onerror = () => { XLSX_LIB = null; mal(new Error("sin conexión")); }; document.head.appendChild(s); });
  return XLSX_LIB;
}
async function exportarExcelCompleto() {
  toast("Preparando Excel…");
  let X; try { X = await cargarXLSX(); } catch { return toast("Se necesita internet para generar el Excel"); }
  const wb = X.utils.book_new();
  const fase = r => r.f === "B" ? "BAJA" : r.f === "E" ? "EN ESPERA" : FASE[r.f];
  for (const [L, g, n] of LISTAS) {
    const vivo = L === "VIVO";
    const arr = regs(L).sort((a, b) => (a.f === "B") - (b.f === "B") || (a.o || 0) - (b.o || 0));
    const head = vivo ? ["#","NOMBRE","NSS","SEXO","F. RECEPCIÓN","ADSC.","GPO","CIUDAD","DONADOR","PARENTESCO","MODALIDAD","TELÉFONOS","CORREO","ESTATUS","FASE","INICIO PROTOCOLO","OBSERVACIONES","AVISO","MOTIVO BAJA","FECHA BAJA"]
      : ["No","ID","NOMBRE","NSS","F. REGISTRO","RESIDENCIA","CURP","F. NACIMIENTO","TELÉFONOS","CORREO","ESTATUS","FASE","INICIO PROTOCOLO","OBSERVACIONES","AVISO","MOTIVO BAJA","FECHA BAJA"];
    const f = x => x ? fmt(x) : "";
    const rows = arr.map(r => vivo
      ? [lugar(L, r.k) || "", r.n, r.nss, r.sx, f(r.fr), r.adsc, r.gpo, r.res, r.don, r.par, r.mod, r.tel, r.mail, r.est, fase(r), f(r.ip), r.obs, r.nota, r.bm, f(r.bf)]
      : [lugar(L, r.k) || "", r.id, r.n, r.nss, f(r.fr), r.res, r.curp, f(r.fnac), r.tel, r.mail, r.est, fase(r), f(r.ip), r.obs, r.nota, r.bm, f(r.bf)]).map(a => a.map(v => v ?? ""));
    X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet([head, ...rows]), vivo ? "LDVR" : g);
  }
  const cols = ["grupo","nombre","fnac","nss","agregado","tel1","tel2","noTx","etiologia","terapia","estatus","motivo","fechaEstatus","revalorar"];
  const headP = ["Lugar en lista","ID CENATRA", ...cols.map(c => CAMPOS_LABEL[c] || c), "Alerta protocolo", "Próx. vencimiento", ...ESTUDIOS.map(e => e[1]), "Último contacto", "Observaciones"];
  const rowsP = ordenar([...S.pacientes]).map(p => { const pr = protocolo(p);
    return [p.regL ? lugar(p.regL, p.regK) || "" : "", p.idCenatra || "", ...cols.map(c => /fnac|fecha|revalorar/i.test(c) ? (p[c] ? fmt(p[c]) : "") : (p[c] ?? "")), pr.alerta, pr.prox ? fmtD(pr.prox) : "", ...ESTUDIOS.map(([k]) => p.estudios?.[k] ? fmt(p.estudios[k]) : ""), p.ultimoContacto ? fmt(p.ultimoContacto) : "", p.observaciones || ""]; });
  X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet([headP, ...rowsP]), "LISTOS (PROTOCOLO TERMINADO)");
  for (const [H] of HIST) {
    const d = S.hist[H]; if (!d) continue;
    X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet([d.cols, ...histRows(H).map(e => e.c)]), (d.hoja || H).slice(0, 31));
  }
  X.writeFile(wb, `LISTA_DE_ESPERA_TR_${iso(new Date())}.xlsx`);
  regLogDescarga();
}
function regLogDescarga() {
  addDoc(collection(db, "historial"), { pacienteId: "listas", nombre: "Listas de espera", accion: "Descarga de Excel completo", cambios: {}, por: S.user.email, fecha: serverTimestamp() }).catch(() => {});
}
// ===================== FIN BAJAS HISTÓRICAS =====================
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
