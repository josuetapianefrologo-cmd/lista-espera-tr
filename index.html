<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lista de Espera TR</title>
<meta name="theme-color" content="#14284b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lista TR">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --navy:#14284b;--navy2:#1f3a68;--ink:#1a1f2b;--muted:#667085;--line:#e3e7ee;--bg:#f4f6f9;--card:#fff;
  --ok:#157f4a;--okbg:#e5f5ec;--warn:#a15c00;--warnbg:#fff1d6;--bad:#b42318;--badbg:#fde8e6;
  --info:#1d4ed8;--infobg:#e3ebfd;--gray:#475467;--graybg:#eef0f4;--purple:#6d28d9;--purplebg:#efe7fd;
  --radius:14px;--safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{
  --ink:#e8ecf3;--muted:#98a2b3;--line:#2a3345;--bg:#0f1520;--card:#171f2e;
  --okbg:#10301f;--warnbg:#3a2a0c;--badbg:#3b1512;--infobg:#142447;--graybg:#232c3c;--purplebg:#2a1a47;
  --ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--info:#93b4ff;--gray:#b6bfcc;--purple:#c4a6ff;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
.hrow{display:flex;align-items:center;gap:10px;max-width:960px;margin:0 auto}
.htitle{flex:1;min-width:0}
.htitle b{display:block;font-size:17px}
.htitle small{opacity:.75;font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{font-size:11px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.15);white-space:nowrap}
.sync.off{background:#b42318}
main{max-width:960px;margin:0 auto;padding:12px 16px calc(84px + var(--safe-b))}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:var(--safe-b)}
nav.tabs button{flex:1;border:0;background:none;padding:9px 4px 8px;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.tabs button.on{color:var(--navy2);font-weight:600}
@media (prefers-color-scheme:dark){nav.tabs button.on{color:#9db8ff}}
nav.tabs svg{width:22px;height:22px}
.search{display:flex;gap:8px;margin-bottom:10px}
.search input{flex:1;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;white-space:nowrap;font-size:13px;cursor:pointer}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.sec{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin:14px 2px 6px;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:8px}
.pt{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.gb{flex:0 0 auto;min-width:40px;height:40px;border-radius:10px;background:var(--navy);color:#fff;font-weight:700;display:grid;place-items:center;font-size:14px}
.pt .info{flex:1;min-width:0}
.pt .name{font-weight:600;line-height:1.25}
.pt .meta{color:var(--muted);font-size:13px;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.t-ok{background:var(--okbg);color:var(--ok)}.t-warn{background:var(--warnbg);color:var(--warn)}.t-bad{background:var(--badbg);color:var(--bad)}
.t-info{background:var(--infobg);color:var(--info)}.t-gray{background:var(--graybg);color:var(--gray)}.t-purple{background:var(--purplebg);color:var(--purple)}
.calls{display:flex;gap:6px;margin-top:10px}
.callbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:10px;background:var(--okbg);color:var(--ok);font-weight:600;text-decoration:none;font-size:14px}
.callbtn svg{width:16px;height:16px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--graybg);color:var(--ink)}
.btn.pri{background:var(--navy);color:#fff}.btn.danger{background:var(--badbg);color:var(--bad)}
.btn.block{width:100%}
.fab{position:fixed;right:18px;bottom:calc(78px + var(--safe-b));z-index:21;width:54px;height:54px;border-radius:50%;border:0;background:var(--navy);color:#fff;font-size:28px;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer}
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:0 0 calc(16px + var(--safe-b))}
@media (min-width:760px){.sheet-bg{align-items:center}.sheet{border-radius:18px;max-height:90vh}}
.sh-head{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px;z-index:2}
.sh-head b{flex:1;font-size:16px}
.x{border:0;background:var(--graybg);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px}
.sh-body{padding:14px 16px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.kv div small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.03em}
.studies{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.st{border-radius:10px;padding:8px 10px;font-size:13px}
.st b{display:block;font-size:12px}
.st span{font-size:12px;display:block;white-space:normal}
.st{white-space:normal}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:10px}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:15px}
.na{display:flex;align-items:center;gap:4px;font-size:12px;margin-top:4px}
.na input{width:auto;margin:0}
.login{max-width:380px;margin:12vh auto;text-align:center;padding:0 20px}
.login .logo{width:76px;height:76px;margin:0 auto 14px}
.notice{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{font-size:24px;display:block}
.stat small{color:var(--muted)}
table.res{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border-radius:12px;overflow:hidden}
table.res th,table.res td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center}
table.res th:first-child,table.res td:first-child{text-align:left;padding-left:12px}
.hist{font-size:13px;border-left:3px solid var(--line);padding:4px 0 8px 10px;margin-bottom:6px}
.hist small{color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + var(--safe-b));background:#111827;color:#fff;padding:10px 16px;border-radius:12px;z-index:60;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
textarea{resize:vertical}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
// ===================== CONFIGURACIÓN =====================
// Pega aquí la configuración de TU proyecto de Firebase (ver GUIA.md).
// Estos valores no son secretos: la seguridad la dan las reglas de Firestore.
const firebaseConfig = {
  apiKey: "AIzaSyCcwi3hKOXWeL_0xNfc8f2VhGxW4iuCLAo",
  authDomain: "lista-espera-tr.firebaseapp.com",
  projectId: "lista-espera-tr",
  appId: "1:497579905509:web:501b0b873d7c6c10d7df0c"
};
const ADMIN_EMAIL = "josuetapianefrologo@gmail.com";
// =========================================================

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, onSnapshot, setDoc, addDoc,
  deleteDoc, getDoc, serverTimestamp, query, orderBy, limit, where, writeBatch }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// ---------- Catálogos ----------
const GRUPOS = ["A+","A-","B+","B-","O+","O-","AB+","AB-"];
const ESTATUS = ["COMPLETO","INCOMPLETO","CADUCADO","EN ACTUALIZACIÓN","NO LOCALIZADO","INACTIVO TEMPORAL","INACTIVO DEFINITIVO","TRASPLANTADO"];
const ESTATUS_INFO = {
  "COMPLETO":"Protocolo completo y vigente. Elegible para oferta de órgano.",
  "INCOMPLETO":"Falta ≥1 estudio o valoración.",
  "CADUCADO":"≥1 estudio con vigencia vencida. Actualizar antes de ser elegible.",
  "EN ACTUALIZACIÓN":"Ya se enviaron citas para actualizar estudios.",
  "NO LOCALIZADO":"Se llamó y no contesta / número fuera de servicio.",
  "INACTIVO TEMPORAL":"Contraindicación temporal. Capturar motivo y fecha para revalorar.",
  "INACTIVO DEFINITIVO":"Contraindicación absoluta o baja definitiva.",
  "TRASPLANTADO":"Ya recibió trasplante; se conserva para registro."
};
const TERAPIAS = ["HD","DP","PREDIÁLISIS"];
// Estudios: [clave, etiqueta, meses de vigencia (0 = no caduca), requerido]
const ESTUDIOS = [
  ["cardio","Cardiología",6,true],["ecott","ECOTT",6,true],["serologias","Serologías",6,true],["ppd","PPD",6,true],["otorrino","Otorrino",6,true],
  ["urologia","Urología",0,true],["infecto","Infectología",0,true],["psicologia","Psicología",0,true],["psiquiatria","Psiquiatría",0,true],
  ["qxtr","Qx Trasplante",0,true],["neumologia","Neumología",0,true],["dental","Dental",0,true],["gineco","Ginecología",0,true],
  ["valorado","Valorado (comité)",0,false]
];
const CAMPOS_LABEL = {grupo:"Grupo",nombre:"Nombre",fnac:"Fecha nacimiento",nss:"NSS",agregado:"Agregado",tel1:"Tel 1",tel2:"Tel 2",noTx:"No. trasplante",
  etiologia:"Etiología",terapia:"Terapia",estatus:"Estatus",fechaEstatus:"Fecha estatus",revalorar:"Revalorar el",ultimoContacto:"Último contacto",observaciones:"Observaciones"};
ESTUDIOS.forEach(([k,l]) => CAMPOS_LABEL["estudios."+k] = l);

// ---------- Fechas ----------
const hoy = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const parse = s => { if (!s || s === "NA") return null; const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addMonths = (d, n) => { const r = new Date(d); r.setMonth(r.getMonth() + n); return r; };
const fmt = s => { if (!s) return "—"; if (s === "NA") return "NA"; const [y,m,d] = s.split("-"); return `${d}/${m}/${y}`; };
const fmtD = d => d ? `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}` : "—";
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const edad = s => { const d = parse(s); if (!d) return ""; const h = hoy(); let a = h.getFullYear() - d.getFullYear();
  if (h.getMonth() < d.getMonth() || (h.getMonth() === d.getMonth() && h.getDate() < d.getDate())) a--; return a; };

// ---------- Cálculo del protocolo ----------
function evalEstudio(key, val, meses) {
  if (val === "NA") return {s:"na", txt:"No aplica"};
  const d = parse(val);
  if (!d) return {s:"falta", txt:"Pendiente"};
  if (!meses) return {s:"ok", txt:fmt(val)};
  const vence = addMonths(d, meses), h = hoy();
  if (vence < h) return {s:"cad", txt:`${fmt(val)}<br>venció ${fmtD(vence)}`, vence};
  if ((vence - h) / 864e5 <= 30) return {s:"pronto", txt:`${fmt(val)}<br>vence ${fmtD(vence)}`, vence};
  return {s:"ok", txt:`${fmt(val)}<br>vence ${fmtD(vence)}`, vence};
}
function protocolo(p) {
  let cad = 0, falt = 0, prox = null, pronto = 0;
  for (const [k,,m,req] of ESTUDIOS) {
    const e = evalEstudio(k, p.estudios?.[k] || "", m);
    if (req && e.s === "falta") falt++;
    if (e.s === "cad") cad++;
    if (e.s === "pronto") pronto++;
    if (e.vence && (!prox || e.vence < prox)) prox = e.vence;
  }
  let alerta;
  if (p.estatus === "TRASPLANTADO" || p.estatus === "INACTIVO DEFINITIVO") alerta = "—";
  else if (p.estatus === "INACTIVO TEMPORAL" && p.revalorar && parse(p.revalorar) <= hoy()) alerta = "REVALORAR";
  else if (cad) alerta = "CADUCADO";
  else if (falt) alerta = "INCOMPLETO";
  else if (pronto) alerta = "POR VENCER";
  else alerta = "VIGENTE";
  return {cad, falt, prox, alerta};
}
const tagEstatus = e => ({"COMPLETO":"t-ok","INCOMPLETO":"t-warn","CADUCADO":"t-bad","EN ACTUALIZACIÓN":"t-info","NO LOCALIZADO":"t-purple",
  "INACTIVO TEMPORAL":"t-gray","INACTIVO DEFINITIVO":"t-gray","TRASPLANTADO":"t-info"}[e] || "t-gray");
const tagAlerta = a => ({"VIGENTE":"t-ok","POR VENCER":"t-warn","INCOMPLETO":"t-warn","CADUCADO":"t-bad","REVALORAR":"t-purple"}[a] || "t-gray");
const ORD_G = g => { const i = ["A+","B+","O+","AB+","A-","B-","O-","AB-"].indexOf(g); return i < 0 ? 99 : i; };

// ---------- Íconos ----------
const I = {
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3v18h18M7 15v3M12 10v8M17 6v12"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>'
};

// ---------- Estado ----------
const S = { user:null, rol:null, pacientes:[], acceso:{editores:[],lectores:[]}, tab:"elegibles", q:"", fGrupo:"", fEstatus:"", fAlerta:"",
  online:navigator.onLine, pendientes:false, unsub:[] };
const puedeEditar = () => S.rol === "admin" || S.rol === "editor";

function toast(msg){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2600); }

// ---------- Firebase ----------
const configurado = !Object.values(firebaseConfig).some(v => String(v).includes("PEGAR_AQUI"));
let auth, db;
if (configurado) {
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
  getRedirectResult(auth).catch(e => console.warn(e));
  onAuthStateChanged(auth, onUser);
} else {
  $app.innerHTML = `<div class="login"><img class="logo" src="icon.svg" alt=""><h2>Falta configurar</h2>
    <p style="color:var(--muted)">Pega la configuración de tu proyecto de Firebase en <b>index.html</b> (sección CONFIGURACIÓN). Ver GUIA.md.</p></div>`;
}

function renderLogin(msg = "") {
  $app.innerHTML = `<div class="login">
    <img class="logo" src="icon.svg" alt="">
    <h2 style="margin:0 0 4px">Lista de Espera</h2>
    <p style="color:var(--muted);margin:0 0 22px">Trasplante renal · donador fallecido<br>UMAE HE No. 1 · CMN del Bajío</p>
    ${msg ? `<div class="notice">${msg}</div>` : ""}
    <button class="btn pri block" id="bLogin">Entrar con Google</button>
    <p style="color:var(--muted);font-size:12px;margin-top:18px">Acceso solo para personal autorizado.</p></div>`;
  document.getElementById("bLogin").onclick = async () => {
    const prov = new GoogleAuthProvider(); prov.setCustomParameters({prompt:"select_account"});
    const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
    try { standalone ? await signInWithRedirect(auth, prov) : await signInWithPopup(auth, prov); }
    catch (e) { if (e.code === "auth/popup-blocked") await signInWithRedirect(auth, prov); else renderLogin("No se pudo iniciar sesión: " + esc(e.code || e.message)); }
  };
}

async function onUser(u) {
  S.unsub.forEach(f => f()); S.unsub = [];
  S.user = u;
  if (!u) { renderLogin(); return; }
  const email = (u.email || "").toLowerCase();
  if (email === ADMIN_EMAIL) S.rol = "admin";
  else {
    try {
      const snap = await getDoc(doc(db, "config", "acceso"));
      const a = snap.data() || {};
      S.rol = (a.editores || []).includes(email) ? "editor" : (a.lectores || []).includes(email) ? "lector" : null;
    } catch { S.rol = null; }
  }
  if (!S.rol) { await signOut(auth); renderLogin(`La cuenta <b>${esc(email)}</b> no tiene acceso. Pide al Dr. Tapia que la agregue.`); return; }
  $app.innerHTML = `<div class="empty">Cargando…</div>`;
  let first = true;
  const t = setTimeout(() => { if (first) $app.innerHTML = `<div class="empty">Sin conexión y sin datos guardados en este dispositivo. Conéctate una vez para descargar la lista.</div>`; }, 12000);
  S.unsub.push(onSnapshot(collection(db, "pacientes"), { includeMetadataChanges: true }, snap => {
    first = false; clearTimeout(t);
    S.pacientes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    S.pendientes = snap.metadata.hasPendingWrites;
    S.desdeCache = snap.metadata.fromCache;
    render();
  }, e => { $app.innerHTML = `<div class="empty">Error de acceso: ${esc(e.code)}</div>`; }));
  if (S.rol === "admin") S.unsub.push(onSnapshot(doc(db, "config", "acceso"), s => { S.acceso = { editores:[], lectores:[], ...(s.data()||{}) }; if (S.tab === "ajustes") render(); }));
}
addEventListener("online", () => { S.online = true; render(); });
addEventListener("offline", () => { S.online = false; render(); });

// ---------- Render principal ----------
function render() {
  if (!S.user || !S.rol) return;
  const scroll = scrollY;
  const syncTxt = !S.online ? "Sin conexión · guardado en el equipo" : S.pendientes ? "Sincronizando…" : "Sincronizado";
  const tabs = [["elegibles","Elegibles",I.star],["lista","Lista",I.list],["resumen","Resumen",I.chart],["historial","Cambios",I.clock]];
  if (S.rol === "admin") tabs.push(["ajustes","Ajustes",I.gear]);
  $app.innerHTML = `
  <header><div class="hrow"><div class="htitle"><b>Lista de Espera TR</b><small>${esc(S.user.email)} · ${S.rol === "lector" ? "solo consulta" : S.rol}</small></div>
    <span class="sync ${!S.online ? "off" : ""}">${syncTxt}</span></div></header>
  <main id="main"></main>
  ${puedeEditar() && (S.tab === "lista" || S.tab === "elegibles") ? `<button class="fab" id="fab" aria-label="Nuevo paciente">+</button>` : ""}
  <nav class="tabs">${tabs.map(([k,l,ic]) => `<button data-tab="${k}" class="${S.tab===k?"on":""}">${ic}${l}</button>`).join("")}</nav>`;
  document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => { S.tab = b.dataset.tab; render(); scrollTo(0,0); });
  const fab = document.getElementById("fab"); if (fab) fab.onclick = () => openForm(null);
  const m = document.getElementById("main");
  ({ elegibles: vElegibles, lista: vLista, resumen: vResumen, historial: vHistorial, ajustes: vAjustes })[S.tab](m);
  scrollTo(0, scroll);
}

function telLinks(p) {
  const t = [p.tel1, p.tel2].filter(Boolean);
  if (!t.length) return `<div class="meta" style="margin-top:8px">Sin teléfono registrado</div>`;
  return `<div class="calls">${t.map((n,i) => `<a class="callbtn" href="tel:${esc(n.replace(/\D/g,""))}" onclick="event.stopPropagation()">${I.phone}${esc(n)}</a>`).join("")}</div>`;
}
function ptCard(p, conTel = false) {
  const pr = protocolo(p);
  return `<div class="card" data-id="${esc(p.id)}"><div class="pt">
    <div class="gb">${esc(p.grupo)}</div>
    <div class="info"><div class="name">${esc(p.nombre)}</div>
      <div class="meta">${[edad(p.fnac) !== "" ? edad(p.fnac) + " años" : "", p.terapia, p.noTx ? "Tx #" + p.noTx : ""].filter(Boolean).map(esc).join(" · ")}</div>
      <div class="tags"><span class="tag ${tagEstatus(p.estatus)}">${esc(p.estatus || "SIN ESTATUS")}</span>
        ${pr.alerta !== "—" ? `<span class="tag ${tagAlerta(pr.alerta)}">Protocolo: ${pr.alerta}</span>` : ""}
        ${pr.prox && pr.alerta !== "—" ? `<span class="tag t-gray">Vence ${fmtD(pr.prox)}</span>` : ""}</div>
      ${p.observaciones ? `<div class="meta" style="margin-top:6px">${esc(p.observaciones)}</div>` : ""}
    </div></div>${conTel ? telLinks(p) : ""}</div>`;
}
function bindCards(root) { root.querySelectorAll(".card[data-id]").forEach(c => c.onclick = () => openFicha(c.dataset.id)); }
const ordenar = arr => arr.sort((a,b) => ORD_G(a.grupo) - ORD_G(b.grupo) || a.nombre.localeCompare(b.nombre, "es"));

function vElegibles(m) {
  const el = ordenar(S.pacientes.filter(p => p.estatus === "COMPLETO"));
  const porG = {}; el.forEach(p => (porG[p.grupo] ||= []).push(p));
  const conCad = el.filter(p => protocolo(p).alerta === "CADUCADO").length;
  m.innerHTML = `<div class="notice" style="background:var(--infobg);color:var(--info)">Pacientes con estatus <b>COMPLETO</b>. Toca un teléfono para llamar.</div>
    ${conCad ? `<div class="notice" style="background:var(--badbg);color:var(--bad)"><b>${conCad} de ${el.length}</b> tienen estudios caducados según sus fechas. Revisa su estatus antes de considerarlos para una oferta.</div>` : ""}
    ${!el.length ? `<div class="empty">No hay pacientes con estatus COMPLETO.</div>` :
      Object.keys(porG).sort((a,b) => ORD_G(a)-ORD_G(b)).map(g => `<div class="sec">Grupo ${esc(g)} · ${porG[g].length}</div>${porG[g].map(p => ptCard(p, true)).join("")}`).join("")}`;

}

function vLista(m) {
  const q = S.q.toLowerCase().normalize("NFD").replace(/\p{Diacritic}/gu,"");
  const norm = s => (s||"").toLowerCase().normalize("NFD").replace(/\p{Diacritic}/gu,"");
  let arr = S.pacientes.filter(p => (!S.fGrupo || p.grupo === S.fGrupo) && (!S.fEstatus || p.estatus === S.fEstatus)
    && (!S.fAlerta || protocolo(p).alerta === S.fAlerta)
    && (!q || norm(p.nombre).includes(q) || (p.nss||"").includes(q) || (p.tel1||"").includes(q) || (p.tel2||"").includes(q)));
  ordenar(arr);
  const gruposUsados = GRUPOS.filter(g => S.pacientes.some(p => p.grupo === g));
  m.innerHTML = `<div class="search"><input id="q" type="search" placeholder="Buscar nombre, NSS o teléfono" value="${esc(S.q)}"></div>
    <div class="chips">${["", ...gruposUsados].map(g => `<button class="chip ${S.fGrupo===g?"on":""}" data-g="${g}">${g || "Todos"}</button>`).join("")}</div>
    <div class="chips">${["", ...ESTATUS].map(e => `<button class="chip ${S.fEstatus===e?"on":""}" data-e="${e}">${e || "Cualquier estatus"}</button>`).join("")}</div>
    <div class="chips">${["","CADUCADO","POR VENCER","INCOMPLETO","VIGENTE","REVALORAR"].map(a => `<button class="chip ${S.fAlerta===a?"on":""}" data-a="${a}">${a ? "Protocolo: "+a : "Cualquier alerta"}</button>`).join("")}</div>
    <div class="sec">${arr.length} paciente${arr.length===1?"":"s"}</div>
    ${arr.length ? arr.map(p => ptCard(p)).join("") : `<div class="empty">Sin resultados.</div>`}`;
  const qi = m.querySelector("#q");
  qi.oninput = () => { S.q = qi.value; const pos = qi.selectionStart; render(); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(pos,pos); };
  m.querySelectorAll("[data-g]").forEach(b => b.onclick = () => { S.fGrupo = b.dataset.g; render(); });
  m.querySelectorAll("[data-e]").forEach(b => b.onclick = () => { S.fEstatus = b.dataset.e; render(); });
  m.querySelectorAll("[data-a]").forEach(b => b.onclick = () => { S.fAlerta = b.dataset.a; render(); });
  bindCards(m);
}

function vResumen(m) {
  const gs = GRUPOS.filter(g => S.pacientes.some(p => p.grupo === g));
  const cnt = (g, f) => S.pacientes.filter(p => (!g || p.grupo === g) && f(p)).length;

  const prox30 = activos.filter(p => { const pr = protocolo(p); return pr.prox && pr.prox >= hoy() && (pr.prox - hoy())/864e5 <= 30; });
  const cols = ["COMPLETO","INCOMPLETO","CADUCADO","EN ACTUALIZACIÓN","NO LOCALIZADO","INACTIVO TEMPORAL","TRASPLANTADO"];
  const abrev = {"EN ACTUALIZACIÓN":"ACTUAL.","NO LOCALIZADO":"NO LOC.","INACTIVO TEMPORAL":"INACT. T.","TRASPLANTADO":"TX","INCOMPLETO":"INCOMP.","COMPLETO":"COMP.","CADUCADO":"CAD."};
  m.innerHTML = `<div class="stats">
      <div class="stat"><b>${activos.length}</b><small>En lista (activos)</small></div>
      <div class="stat"><b style="color:var(--ok)">${cnt("", p => p.estatus === "COMPLETO")}</b><small>Elegibles</small></div>
      <div class="stat"><b style="color:var(--bad)">${activos.filter(p => protocolo(p).alerta === "CADUCADO").length}</b><small>Con estudios caducados</small></div>
      <div class="stat"><b style="color:var(--warn)">${prox30.length}</b><small>Vencen en 30 días</small></div></div>
    <div class="sec">Por grupo y estatus</div>
    <div style="overflow-x:auto"><table class="res"><tr><th>Grupo</th><th>Total</th>${cols.map(c => `<th>${abrev[c]}</th>`).join("")}</tr>
      ${gs.map(g => `<tr><td><b>${g}</b></td><td>${cnt(g,()=>true)}</td>${cols.map(c => `<td>${cnt(g, p => p.estatus === c) || ""}</td>`).join("")}</tr>`).join("")}
      <tr><td><b>Total</b></td><td><b>${S.pacientes.length}</b></td>${cols.map(c => `<td><b>${cnt("", p => p.estatus === c) || ""}</b></td>`).join("")}</tr></table></div>
    ${prox30.length ? `<div class="sec">Estudios que vencen en los próximos 30 días</div>${ordenar(prox30).map(p => ptCard(p)).join("")}` : ""}
    <div class="sec">Leyenda de estatus</div>
    <div class="card">${ESTATUS.map(e => `<div style="margin-bottom:8px"><span class="tag ${tagEstatus(e)}">${e}</span> <span style="font-size:13px;color:var(--muted)">${ESTATUS_INFO[e]}</span></div>`).join("")}
      <div style="font-size:13px;color:var(--muted);margin-top:8px"><b>Protocolo</b> se calcula solo: Cardiología, ECOTT, Serologías, PPD y Otorrino caducan a los 6 meses.</div></div>`;
  bindCards(m);
}

function vHistorial(m) {
  m.innerHTML = `<div class="empty">Cargando cambios…</div>`;
  const un = onSnapshot(query(collection(db, "historial"), orderBy("fecha","desc"), limit(150)), snap => {
    if (S.tab !== "historial") { un(); return; }

  S.unsub.push(un);
}
function histItem(h) {
  const f = h.fecha?.toDate ? h.fecha.toDate() : null;
  const cambios = Object.entries(h.cambios || {}).map(([k,[a,b]]) => `<div>${esc(CAMPOS_LABEL[k] || k)}: <s style="color:var(--muted)">${esc(a || "vacío")}</s> → <b>${esc(b || "vacío")}</b></div>`).join("");
  return `<div class="hist"><b>${esc(h.accion)}</b> · ${esc(h.nombre)}<br><small>${esc(h.por)} · ${f ? f.toLocaleString("es-MX") : "pendiente de sincronizar"}</small>${cambios ? `<div style="margin-top:4px">${cambios}</div>` : ""}</div>`;
}

function vAjustes(m) {
  const a = S.acceso;
  const lista = (k, titulo, desc) => `<div class="sec">${titulo}</div><div class="card"><div style="font-size:13px;color:var(--muted);margin-bottom:8px">${desc}</div>
    ${(a[k]||[]).map(e => `<div class="row" style="align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>${esc(e)}</span><button class="btn danger" data-del="${k}" data-em="${esc(e)}" style="padding:6px 10px">Quitar</button></div>`).join("") || `<div style="color:var(--muted)">Nadie todavía.</div>`}
    <div class="row" style="margin-top:10px"><input type="email" id="add-${k}" placeholder="correo@gmail.com" style="flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card)"><button class="btn pri" data-add="${k}">Agregar</button></div></div>`;
  m.innerHTML = lista("lectores","Equipo · solo consulta","Pueden ver la lista, los teléfonos y los cambios. No pueden modificar nada.")
    + lista("editores","Equipo · pueden editar","Pueden agregar y modificar pacientes. Todo queda en el historial.")
    + `<div class="sec">Datos</div><div class="card">
      <div style="font-size:13px;color:var(--muted);margin-bottom:10px">Respaldo: descarga toda la lista. Importar: carga un archivo JSON (por ejemplo, el de la lista inicial).</div>
      <div class="row"><button class="btn" id="bCsv">Descargar Excel (CSV)</button><button class="btn" id="bJson">Respaldo JSON</button>
      <label class="btn" style="display:inline-block">Importar JSON<input type="file" id="fImp" accept=".json,application/json" hidden></label></div></div>
      <div class="sec">Sesión</div><button class="btn block" id="bOut">Cerrar sesión</button>`;
  m.querySelectorAll("[data-add]").forEach(b => b.onclick = async () => {
    const k = b.dataset.add, inp = m.querySelector("#add-"+k), em = inp.value.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) return toast("Correo no válido");

    await setDoc(doc(db,"config","acceso"), nuevo); toast("Acceso agregado");
  });
  m.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    const k = b.dataset.del, em = b.dataset.em; if (!confirm(`¿Quitar acceso a ${em}?`)) return;
    await setDoc(doc(db,"config","acceso"), { ...a, [k]: (a[k]||[]).filter(x => x !== em) }); toast("Acceso retirado");
  });
  m.querySelector("#bCsv").onclick = exportCSV;
  m.querySelector("#bJson").onclick = () => descargar(`lista_espera_respaldo_${iso(new Date())}.json`, JSON.stringify(S.pacientes.map(({id,...p}) => p), null, 1), "application/json");
  m.querySelector("#fImp").onchange = importar;
  m.querySelector("#bOut").onclick = () => signOut(auth);
}

// ---------- Ficha ----------
function sheet(titulo, body, acciones = "") {
  const bg = document.createElement("div"); bg.className = "sheet-bg";
  bg.innerHTML = `<div class="sheet"><div class="sh-head"><b>${titulo}</b>${acciones}<button class="x" aria-label="Cerrar">×</button></div><div class="sh-body">${body}</div></div>`;
  const close = () => { bg.remove(); document.body.style.overflow = ""; };
  bg.querySelector(".x").onclick = close; bg.onclick = e => { if (e.target === bg) close(); };
  document.body.appendChild(bg); document.body.style.overflow = "hidden";
  return { el: bg, close };
}
function openFicha(id) {
  const p = S.pacientes.find(x => x.id === id); if (!p) return;
  const pr = protocolo(p);
  const est = ESTUDIOS.map(([k,l,mes]) => { const e = evalEstudio(k, p.estudios?.[k] || "", mes);
    const cls = {ok:"t-ok",pronto:"t-warn",cad:"t-bad",falta:"t-gray",na:"t-gray"}[e.s];
    return `<div class="st tag ${cls}" style="border-radius:10px"><b>${l}${mes ? ` <span style="font-weight:400">(${mes} m)</span>` : ""}</b><span>${e.txt}</span></div>`; }).join("");
  const kv = [["Edad", edad(p.fnac) !== "" ? edad(p.fnac) + " años" : "—"],["Nacimiento", fmt(p.fnac)],["NSS", p.nss],["Agregado", p.agregado],
    ["Terapia", p.terapia],["No. trasplante", p.noTx],["Etiología", p.etiologia],["Fecha estatus", fmt(p.fechaEstatus)],
    ...(p.estatus === "INACTIVO TEMPORAL" ? [["Revalorar el", fmt(p.revalorar)]] : []),["Último contacto", fmt(p.ultimoContacto)]]
    .map(([k,v]) => `<div><small>${k}</small>${esc(v || "—")}</div>`).join("");
  const sh = sheet(esc(p.nombre), `
    <div class="tags" style="margin:0 0 10px"><span class="tag t-info">Grupo ${esc(p.grupo)}</span><span class="tag ${tagEstatus(p.estatus)}">${esc(p.estatus)}</span>
      ${pr.alerta !== "—" ? `<span class="tag ${tagAlerta(pr.alerta)}">Protocolo: ${pr.alerta}</span>` : ""}</div>
    ${telLinks(p)}
    ${p.observaciones ? `<div class="card" style="margin-top:12px"><small style="color:var(--muted)">OBSERVACIONES</small><div>${esc(p.observaciones)}</div></div>` : ""}
    <div class="card" style="margin-top:12px"><div class="kv">${kv}</div></div>
    <div class="sec">Estudios del protocolo · ${pr.cad} caducados · ${pr.falt} pendientes${pr.prox ? ` · próximo vencimiento ${fmtD(pr.prox)}` : ""}</div>
    <div class="studies">${est}</div>
    <div class="sec">Historial de este paciente</div><div id="hp"><div class="empty" style="padding:10px">Cargando…</div></div>
    ${puedeEditar() ? `<div class="row" style="margin-top:16px"><button class="btn pri" id="bEd" style="flex:1">Editar</button><button class="btn" id="bCont" style="flex:1">Registrar llamada</button></div>` : ""}`);
  const un = onSnapshot(query(collection(db,"historial"), where("pacienteId","==",id), limit(40)), snap => {
    const rows = snap.docs.map(d => d.data()).sort((a,b) => (b.fecha?.seconds||9e9) - (a.fecha?.seconds||9e9));
    const hp = sh.el.querySelector("#hp"); if (hp) hp.innerHTML = rows.length ? rows.map(histItem).join("") : `<div style="color:var(--muted);font-size:13px">Sin cambios registrados desde que se usa la app.</div>`;
  }, () => {});
  const oldClose = sh.close; sh.el.querySelector(".x").onclick = () => { un(); oldClose(); };
  sh.el.onclick = e => { if (e.target === sh.el) { un(); oldClose(); } };
  if (puedeEditar()) {
    sh.el.querySelector("#bEd").onclick = () => { un(); oldClose(); openForm(p); };
    sh.el.querySelector("#bCont").onclick = () => { un(); oldClose(); openContacto(p); };
  }
}

// ---------- Guardado con historial ----------
function flat(p) {
  const o = {}; for (const k of Object.keys(CAMPOS_LABEL)) { if (k.startsWith("estudios.")) o[k] = p.estudios?.[k.slice(9)] || ""; else o[k] = p[k] ?? ""; } return o;
}
async function guardar(id, nuevo, accion) {
  const antes = id ? S.pacientes.find(x => x.id === id) : null;
  const a = antes ? flat(antes) : {}, b = flat(nuevo), cambios = {};
  for (const k of Object.keys(b)) if ((a[k] || "") !== (b[k] || "")) cambios[k] = [a[k] || "", b[k] || ""];
  if (antes && !Object.keys(cambios).length) { toast("Sin cambios"); return true; }
  const ref = id ? doc(db, "pacientes", id) : doc(collection(db, "pacientes"));
  const data = { ...nuevo, actualizado: serverTimestamp(), actualizadoPor: S.user.email };
  delete data.id;
  const batch = writeBatch(db);
  batch.set(ref, data);
  batch.set(doc(collection(db, "historial")), { pacienteId: ref.id, nombre: nuevo.nombre, accion, cambios, por: S.user.email, fecha: serverTimestamp() });
  batch.commit().catch(e => toast("Error al guardar: " + (e.code || e.message)));
  // No esperamos al servidor: con mala señal queda guardado en el equipo y se sube al volver la conexión.
  toast(S.online ? "Guardado" : "Guardado en el equipo · se subirá al volver la señal");
  return true;
}

function openContacto(p) {
  const sh = sheet("Registrar llamada", `<div style="margin-bottom:10px"><b>${esc(p.nombre)}</b></div>
    <label class="f">Fecha<input type="date" id="cF" value="${iso(new Date())}"></label>
    <label class="f">Resultado / acuerdo<textarea id="cO" rows="3" placeholder="Ej. cita cardio 15/11, no contesta, cambió de teléfono">${esc(p.observaciones || "")}</textarea></label>
    <label class="f">Estatus<select id="cE">${ESTATUS.map(e => `<option ${e===p.estatus?"selected":""}>${e}</option>`).join("")}</select></label>
    <button class="btn pri block" id="cG">Guardar</button>`);
  sh.el.querySelector("#cG").onclick = async () => {
    const est = sh.el.querySelector("#cE").value;
    const n = { ...p, ultimoContacto: sh.el.querySelector("#cF").value, observaciones: sh.el.querySelector("#cO").value.trim(), estatus: est,
      fechaEstatus: est !== p.estatus ? iso(new Date()) : (p.fechaEstatus || "") };
    if (await guardar(p.id, n, "Llamada registrada")) sh.close();
  };
}

function openForm(p) {
  const nuevo = !p;
  p = p ? structuredClone({ ...p, estudios: { ...(p.estudios || {}) } }) : { grupo:"", nombre:"", estatus:"INCOMPLETO", terapia:"", estudios:{} };

  const estF = ESTUDIOS.map(([k,l,mes]) => { const v = p.estudios[k] || ""; return `<label class="f">${l}${mes ? ` (caduca ${mes} m)` : ""}
    <input type="date" data-e="${k}" value="${v === "NA" ? "" : esc(v)}" ${v === "NA" ? "disabled" : ""}>
    <span class="na"><input type="checkbox" data-na="${k}" ${v === "NA" ? "checked" : ""}> No aplica</span></label>`; }).join("");
  const sh = sheet(nuevo ? "Nuevo paciente" : "Editar paciente", `
    <div class="grid2">${sel("grupo","Grupo sanguíneo *",GRUPOS)}${sel("estatus","Estatus *",ESTATUS)}</div>
    ${inp("nombre","Nombre completo *")}
    <div class="grid2">${inp("fnac","Fecha de nacimiento","date")}${inp("nss","NSS","text",'inputmode="numeric"')}
      ${inp("agregado","Agregado")}${sel("terapia","Terapia sustitutiva",TERAPIAS)}
      ${inp("tel1","Teléfono 1","tel")}${inp("tel2","Teléfono 2","tel")}
      ${inp("noTx","No. trasplante","text",'inputmode="numeric"')}${inp("etiologia","Etiología")}
      ${inp("fechaEstatus","Fecha de estatus","date")}${inp("revalorar","Revalorar el (inactivo temporal)","date")}
      ${inp("ultimoContacto","Último contacto","date")}</div>
    <label class="f">Observaciones<textarea data-k="observaciones" rows="3">${esc(p.observaciones || "")}</textarea></label>
    <div class="sec">Estudios (fecha de realización)</div><div class="grid2">${estF}</div>
    <button class="btn pri block" id="fG" style="margin-top:8px">${nuevo ? "Agregar paciente" : "Guardar cambios"}</button>
    ${!nuevo && S.rol === "admin" ? `<button class="btn danger block" id="fDel" style="margin-top:10px">Eliminar paciente</button>
      <div style="font-size:12px;color:var(--muted);margin-top:6px">Sugerencia: para bajas usa el estatus INACTIVO DEFINITIVO en vez de eliminar.</div>` : ""}`);
  const el = sh.el;
  el.querySelectorAll("[data-na]").forEach(c => c.onchange = () => { const d = el.querySelector(`[data-e="${c.dataset.na}"]`); d.disabled = c.checked; if (c.checked) d.value = ""; });
  el.querySelector("#fG").onclick = async () => {
    const n = { ...p, estudios: {} };
    el.querySelectorAll("[data-k]").forEach(i => n[i.dataset.k] = i.value.trim());
    el.querySelectorAll("[data-e]").forEach(i => { const k = i.dataset.e; n.estudios[k] = el.querySelector(`[data-na="${k}"]`).checked ? "NA" : i.value; });
    n.nombre = n.nombre.toUpperCase();
    if (!n.nombre || !n.grupo || !n.estatus) return toast("Faltan nombre, grupo o estatus");
    const dup = S.pacientes.find(x => x.nombre === n.nombre && x.id !== p.id);
    if (dup && !confirm("Ya existe un paciente con ese nombre. ¿Guardar de todos modos?")) return;
    if (!nuevo && n.estatus !== p.estatus && !n.fechaEstatus) n.fechaEstatus = iso(new Date());
    if (await guardar(nuevo ? null : p.id, n, nuevo ? "Paciente agregado" : "Datos modificados")) sh.close();
  };
  const del = el.querySelector("#fDel");
  if (del) del.onclick = async () => {
    if (!confirm(`¿Eliminar a ${p.nombre}? Quedará registrado en el historial con todos sus datos.`)) return;
    const b = writeBatch(db);
    b.delete(doc(db, "pacientes", p.id));
    const respaldo = flat(p); const cambios = {}; for (const k in respaldo) if (respaldo[k]) cambios[k] = [respaldo[k], ""];
    b.set(doc(collection(db, "historial")), { pacienteId: p.id, nombre: p.nombre, accion: "Paciente ELIMINADO", cambios, por: S.user.email, fecha: serverTimestamp() });
    b.commit().catch(e => toast("Error: " + e.code)); sh.close(); toast("Paciente eliminado");
  };
}

// ---------- Importar / exportar ----------
function descargar(nombre, contenido, tipo) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([contenido], { type: tipo })); a.download = nombre; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function exportCSV() {
  const cols = ["grupo","nombre","fnac","nss","agregado","tel1","tel2","noTx","etiologia","terapia","estatus","fechaEstatus","revalorar"];
  const head = [...cols.map(c => CAMPOS_LABEL[c]), "Alerta protocolo", "Próx. vencimiento", ...ESTUDIOS.map(e => e[1]), "Último contacto", "Observaciones"];
  const q = v => `"${String(v ?? "").replace(/"/g,'""')}"`;
  const rows = ordenar([...S.pacientes]).map(p => { const pr = protocolo(p);
    return [...cols.map(c => /fnac|fecha|revalorar/i.test(c) ? fmt(p[c]) : p[c]), pr.alerta, fmtD(pr.prox), ...ESTUDIOS.map(([k]) => fmt(p.estudios?.[k])), fmt(p.ultimoContacto), p.observaciones].map(q).join(","); });
  descargar(`lista_espera_${iso(new Date())}.csv`, "﻿" + [head.map(q).join(","), ...rows].join("\n"), "text/csv");
}
async function importar(ev) {
  const f = ev.target.files[0]; if (!f) return;
  let arr; try { arr = JSON.parse(await f.text()); } catch { return toast("Archivo no válido"); }
  if (!Array.isArray(arr)) return toast("El archivo debe ser una lista de pacientes");
  const existentes = new Set(S.pacientes.map(p => p.nombre));
  const nuevos = arr.filter(p => p.nombre && p.grupo && !existentes.has(p.nombre.trim().toUpperCase()));
  if (!confirm(`Se agregarán ${nuevos.length} pacientes (${arr.length - nuevos.length} ya existen y se omiten). ¿Continuar?`)) return;
  for (let i = 0; i < nuevos.length; i += 200) {
    const b = writeBatch(db);
    for (const p of nuevos.slice(i, i + 200)) {
      const ref = doc(collection(db, "pacientes"));
      const n = { ...p, nombre: p.nombre.trim().toUpperCase(), estudios: p.estudios || {}, actualizado: serverTimestamp(), actualizadoPor: S.user.email };
      b.set(ref, n);
      b.set(doc(collection(db, "historial")), { pacienteId: ref.id, nombre: n.nombre, accion: "Importado", cambios: {}, por: S.user.email, fecha: serverTimestamp() });
    }
    await b.commit();
  }
  toast(`${nuevos.length} pacientes importados`); ev.target.value = "";
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
